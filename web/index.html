<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15141c">
<title>Liseuse</title>
<style>
@font-face{font-family:'Bricolage Grotesque';src:url(fonts/bricolage-grotesque-latin-600-normal.woff2) format('woff2');font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'Bricolage Grotesque';src:url(fonts/bricolage-grotesque-latin-800-normal.woff2) format('woff2');font-weight:800;font-style:normal;font-display:swap}
@font-face{font-family:'Inter';src:url(fonts/inter-latin-400-normal.woff2) format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Inter';src:url(fonts/inter-latin-500-normal.woff2) format('woff2');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Inter';src:url(fonts/inter-latin-600-normal.woff2) format('woff2');font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'Inter';src:url(fonts/inter-latin-700-normal.woff2) format('woff2');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'Literata';src:url(fonts/literata-latin-400-normal.woff2) format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Literata';src:url(fonts/literata-latin-600-normal.woff2) format('woff2');font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'Literata';src:url(fonts/literata-latin-400-italic.woff2) format('woff2');font-weight:400;font-style:italic;font-display:swap}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
</style>
<style>
/* Layout : coquille d'appli — rail à gauche sur tablette, barre en bas sur téléphone ; lecteur plein écran par-dessus.
   Couleur : neutres indigo profonds, une couleur par type (manga, BD, webtoon, livre), ambre pour l'action. */
:root{
  --bg:#15141c; --surface:#1d1c27; --surface-2:#272635; --line:#353349;
  --fg:#f2f0f9; --muted:#a3a0b8; --accent:#ffb547; --on-accent:#241703; --danger:#ff6b6b;
  --manga:#ff6f91; --bd:#55c2ff; --webtoon:#c08cff; --livre:#78dca2;
  --shadow:0 12px 32px rgba(0,0,0,.38);
  --f-display:'Bricolage Grotesque','Inter',system-ui,sans-serif;
  --f-ui:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-book:'Literata',Georgia,'Times New Roman',serif;
  --rail:88px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f5f4f9; --surface:#ffffff; --surface-2:#eceaf3; --line:#dcd9e7;
    --fg:#1c1b25; --muted:#5f5c74; --accent:#b4600a; --on-accent:#ffffff; --danger:#cf3535;
    --manga:#d1336a; --bd:#1879c9; --webtoon:#8443d0; --livre:#1b8f53;
    --shadow:0 12px 32px rgba(40,30,90,.13);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f5f4f9; --surface:#ffffff; --surface-2:#eceaf3; --line:#dcd9e7;
  --fg:#1c1b25; --muted:#5f5c74; --accent:#b4600a; --on-accent:#ffffff; --danger:#cf3535;
  --manga:#d1336a; --bd:#1879c9; --webtoon:#8443d0; --livre:#1b8f53;
  --shadow:0 12px 32px rgba(40,30,90,.13);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#15141c; --surface:#1d1c27; --surface-2:#272635; --line:#353349;
  --fg:#f2f0f9; --muted:#a3a0b8; --accent:#ffb547; --on-accent:#241703; --danger:#ff6b6b;
  --manga:#ff6f91; --bd:#55c2ff; --webtoon:#c08cff; --livre:#78dca2;
  --shadow:0 12px 32px rgba(0,0,0,.38);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- coquille ---------- */
.app{height:100%;display:grid;grid-template-columns:var(--rail) minmax(0,1fr)}
.rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 0;border-right:1px solid var(--line);background:var(--surface)}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.04em;margin-bottom:18px}
.brand i{font-style:normal;color:var(--accent)}
.nav-btn{width:72px;border:0;background:none;border-radius:16px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:11.5px;font-weight:600}
.nav-btn svg{width:24px;height:24px}
.nav-btn .ico{width:56px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .2s}
.nav-btn[aria-current="true"]{color:var(--fg)}
.nav-btn[aria-current="true"] .ico{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent)}
.main{min-width:0;height:100%;overflow-y:auto;overflow-x:hidden;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:0 120px}
.view{max-width:1400px;margin:0 auto}
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:20px 14px;flex-wrap:wrap}
.topbar h1{font-family:var(--f-display);font-weight:800;font-size:34px;letter-spacing:-.035em;margin:0;flex:1;min-width:160px;text-wrap:balance}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:44px;min-width:0;flex:0 1 300px}
.search input{border:0;background:none;outline:none;width:100%;min-width:0;height:100%}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.sel{height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 12px}
.btn{height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 16px;display:inline-flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.ghost{background:none}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent);background:none}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:transparent}
.btn:disabled{opacity:.5;cursor:default}

.mobile-nav{display:none}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar h1{font-size:28px}
  .search{flex:1 1 180px;order:3}
  .sel{order:4;flex:0 1 auto;min-width:0}
  .mobile-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .mobile-nav .nav-btn{width:auto;flex:1}
}

/* ---------- bibliothèque ---------- */
.section-title{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 10px}
.resume-row{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.resume{flex:0 0 min(360px,86%);display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;text-align:left}
.resume img{width:64px;aspect-ratio:2/3;object-fit:cover;border-radius:8px;flex:none;background:var(--surface-2)}
.resume b{display:block;font-size:16px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.resume small{color:var(--muted);font-size:13px}
.resume .go{margin-left:auto;width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.resume .go svg{width:20px;height:20px}
.resume .info{min-width:0;flex:1}
.bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
.chip{height:36px;border-radius:18px;border:1px solid var(--line);background:var(--surface);padding:0 14px;display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted))}
.chip .n{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--c,var(--accent)) 20%,var(--surface));border-color:color-mix(in srgb,var(--c,var(--accent)) 60%,transparent)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px;margin-top:14px}
@media (max-width:760px){.grid{grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:18px 12px}}
.card{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.cover{position:relative;aspect-ratio:2/3;width:100%;max-width:100%;border-radius:12px;overflow:hidden;background:var(--surface-2);box-shadow:var(--shadow);transition:transform .18s}
.card:hover .cover{transform:translateY(-3px)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:8px;background:var(--c);color:#14121a}
.cover .bar{position:absolute;left:0;right:0;bottom:0;margin:0;height:5px;border-radius:0;background:rgba(0,0,0,.45)}
.cover .bar i{border-radius:0}
.cover .new{position:absolute;bottom:8px;right:8px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--accent);color:var(--on-accent)}
.cover .done{position:absolute;inset:0;background:rgba(10,10,14,.45);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.card .t{font-weight:600;font-size:14.5px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.card .m{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:-4px}

.empty{display:grid;grid-template-columns:auto minmax(0,1fr);gap:36px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:36px;margin-top:20px}
.empty h2{font-family:var(--f-display);font-size:30px;letter-spacing:-.03em;margin:0 0 8px;text-wrap:balance}
.empty p{color:var(--muted);margin:0 0 20px;max-width:56ch}
.empty .actions{display:flex;gap:10px;flex-wrap:wrap}
.stack{position:relative;width:190px;height:220px}
.stack span{position:absolute;width:118px;aspect-ratio:2/3;border-radius:12px;box-shadow:var(--shadow);display:flex;align-items:flex-end;padding:10px;font-family:var(--f-display);font-weight:800;color:#14121a;font-size:15px}
.stack span:nth-child(1){left:0;top:30px;transform:rotate(-10deg);background:var(--bd)}
.stack span:nth-child(2){left:36px;top:10px;transform:rotate(-2deg);background:var(--livre)}
.stack span:nth-child(3){left:72px;top:24px;transform:rotate(8deg);background:var(--manga)}
.formats{display:flex;gap:6px;flex-wrap:wrap;margin:-8px 0 20px}
.formats code{font-family:var(--f-ui);font-size:12px;font-weight:700;padding:4px 8px;border-radius:7px;background:var(--surface-2);color:var(--muted)}
@media (max-width:640px){.empty{grid-template-columns:1fr;padding:24px}.stack{margin:0 auto}}

/* ---------- listes ---------- */
.list{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.row{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.row img{width:48px;aspect-ratio:2/3;object-fit:cover;border-radius:7px;flex:none;background:var(--surface-2)}
.row .info{min-width:0;flex:1}
.row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--muted);font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:14px;max-width:70ch}

.sources{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:8px}
.source{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.source h3{margin:0;font-family:var(--f-display);font-size:21px;letter-spacing:-.02em}
.source p{margin:0;color:var(--muted)}
.source .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.pill{align-self:flex-start;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.xsrc .xhead{display:flex;gap:12px;align-items:center;min-width:0}
.xsrc .xhead > div{min-width:0}.xsrc .xhead small{color:var(--muted);font-size:12.5px}
.xico{position:relative;width:46px;height:46px;flex:none;border-radius:13px;overflow:hidden;display:grid;place-items:center;background:hsl(var(--h) 55% 46%);color:#fff;font-family:var(--f-display);font-weight:800;font-size:22px}
.xico img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.xadd{border-style:dashed}
.xadd .pill{display:inline-flex;align-items:center;gap:6px}.xadd .pill svg{width:14px;height:14px}
.xform{display:flex;gap:8px;flex-wrap:wrap}
.xform input{flex:1 1 200px;min-width:0;height:44px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:14px;padding:0 12px;font:inherit}
.xerrline{color:var(--danger);font-size:13.5px;min-height:0}.xerrline:empty{display:none}
.xh{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xcover{background:linear-gradient(160deg,hsl(var(--h) 45% 38%),hsl(calc(var(--h) + 40) 50% 22%))}
.xcover .xt{position:absolute;inset:auto 10px 12px 10px;color:#fff;font-family:var(--f-display);font-weight:800;font-size:15px;line-height:1.15;overflow-wrap:anywhere}
.xcover img{position:relative;z-index:1}
.xload{margin-top:22px}
.xerr{display:flex;flex-direction:column;gap:6px;align-items:flex-start;margin-top:18px;padding:16px;border-radius:16px;background:color-mix(in srgb,var(--danger) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--danger) 35%,transparent)}
.xerr span{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.xmore{display:flex;justify-content:center;margin:26px 0 10px}
.xh2{font-family:var(--f-display);font-size:26px;letter-spacing:-.03em;margin:0 0 10px;line-height:1.1;overflow-wrap:anywhere}
.xdesc{color:var(--muted);font-size:14px;margin:12px 0 0;max-height:9.5em;overflow:auto}
.xchs{display:flex;flex-direction:column;margin-top:18px;border-top:1px solid var(--line)}
.xch{display:flex;align-items:center;gap:8px;padding:10px 2px;border-bottom:1px solid var(--line)}
.xch .xc{flex:1;min-width:0;display:flex;flex-direction:column}
.xch .xc b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xch .xc small{color:var(--muted);font-size:12.5px}
.xch.read .xc b{color:var(--muted)}
.xch .btn{height:40px;padding:0 12px}.xch .btn svg{width:18px;height:18px}
.xok{color:var(--livre);font-weight:600}
.xprog:empty{display:none}.xprog{color:var(--accent)!important;font-weight:600}
.xurl{overflow-wrap:anywhere;font-size:13px}
.xlogh{margin:16px 0 6px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.xlog{margin:0;max-height:180px;overflow:auto;background:var(--surface-2);border-radius:12px;padding:10px;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.pill.on{background:color-mix(in srgb,var(--livre) 22%,transparent);color:var(--livre)}

.settings{display:flex;flex-direction:column;gap:14px;max-width:760px}
.group{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px 18px}
.group h3{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
.set{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.group h3 + .set{border-top:0}
.set .lbl{min-width:0;flex:1 1 220px}
.set .lbl small{display:block;color:var(--muted);font-size:13px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:9px;padding:7px 12px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch{width:52px;height:30px;border-radius:15px;border:0;background:var(--surface-2);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.switch[aria-checked="true"]{background:color-mix(in srgb,var(--accent) 40%,var(--surface-2))}
.switch[aria-checked="true"]::after{transform:translateX(22px);background:var(--accent)}
input[type=range]{accent-color:var(--accent)}

/* ---------- feuilles ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(8,7,12,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:761px){.scrim{align-items:center}}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:24px;width:min(720px,100%);max-height:calc(100% - 20px);overflow:auto;box-shadow:var(--shadow);padding:22px}
.sheet h2{font-family:var(--f-display);font-size:24px;letter-spacing:-.03em;margin:0 0 4px}
.sheet .sub{color:var(--muted);margin:0 0 16px}
.sheet .foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.imp{display:flex;flex-direction:column;gap:10px}
.imp-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface-2);border-radius:14px;padding:10px 12px}
.imp-row input{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:40px;padding:0 10px;width:100%;min-width:0}
.imp-row .fmt{font-size:12px;color:var(--muted);margin-top:4px}
.imp-row .warn{color:var(--danger);font-size:13px;grid-column:1/-1}
@media (max-width:560px){.imp-row{grid-template-columns:1fr}}
.kind-seg button[aria-pressed="true"]{color:#14121a;background:var(--c)}

.detail{display:grid;grid-template-columns:180px minmax(0,1fr);gap:22px}
.detail .cover{box-shadow:var(--shadow)}
.detail .ttl{border:1px solid transparent;background:none;font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.03em;width:100%;border-radius:10px;padding:2px 6px;margin-left:-6px}
.detail .ttl:hover,.detail .ttl:focus{border-color:var(--line);background:var(--surface-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:12px 0;font-variant-numeric:tabular-nums}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.detail .field{margin-top:12px}
.detail .field > span{display:block;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
@media (max-width:560px){.detail{grid-template-columns:110px minmax(0,1fr);gap:14px}.detail .ttl{font-size:20px}}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--danger) 12%,transparent);border-radius:14px;padding:10px 12px;margin-top:12px}
.confirm span{flex:1 1 200px;font-weight:600}

.toasts{position:fixed;z-index:100;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(520px,calc(100% - 32px))}

async function extPages(work) {

  const pages = pageMemo.get(work.srcKey) || normPages(await EXT.call(x.id, "pages", work.src.chapter, work.src.item));
  pageMemo.delete(work.srcKey);

function pct(w) {
  if (w.done) return 100; const p = w.progress; if (!p) return 0;
  if (p.ch !== undefined) return Math.round(((p.ch + (p.frac || 0)) / Math.max(1, w.pages)) * 100);
  return Math.round(((p.page + 1) / Math.max(1, p.total || w.pages)) * 100);
}
function where(w) {
  const p = w.progress;
  if (w.done) return "Terminé";
  if (!p) return w.format === "ext" && !w.pages ? "À lire en ligne" : `${w.pages} ${isBook(w) ? "chapitre" : "page"}${w.pages > 1 ? "s" : ""}`;

}

  if (s < 86400) return `il y a ${Math.floor(s / 3600)} h`; const d = Math.floor(s / 86400);

}

  }
  const wm = t.closest("[data-wmode]");
  if (wm) { const w = works.find(x => x.id === $("#sheetRoot").dataset.work); if (w) { w.mode = wm.dataset.wmode || null; await DB.putWork(w); wm.parentElement.querySelectorAll("[data-wmode]").forEach(b => b.setAttribute("aria-pressed", String(b === wm))); } return; }
  const st = t.closest("[data-set]");
  if (st) { const key = st.dataset.set; S[key] = st.dataset.val; saveS(); if (key === "theme") applyTheme(); render(); return; }
  const tg = t.closest("[data-toggle]");
  if (tg) { S[tg.dataset.toggle] = !S[tg.dataset.toggle]; saveS(); render(); return; }
  const xb = t.closest("[data-xbrowse]"); if (xb) { closeSheet(); browse(xb.dataset.xbrowse); return; }
  const xi = t.closest("[data-xinfo]"); if (xi) { openExtInfo(xi.dataset.xinfo); return; }
  const xra = t.closest("[data-xrmask]"); if (xra) { openExtInfo(xra.dataset.xrmask, true); return; }
  const xrm = t.closest("[data-xrm]"); if (xrm) { const id = xrm.dataset.xrm; EXT.stop(id); EXT.list = EXT.list.filter(x => x.id !== id); await EXT.save(); closeSheet(); if (B && B.id === id) B = null; render(); toast("Extension supprimée."); return; }
  const xu = t.closest("[data-xupd]");
  if (xu) { const x = EXT.get(xu.dataset.xupd); if (!x) return; xu.disabled = true; xu.textContent = "Vérification…";
    try { const old = x.version; const { entry } = await EXT.install(x.url); toast(entry.code === x.code ? "Déjà à jour." : `« ${entry.name} » mise à jour${entry.version !== old ? " (v" + entry.version + ")" : ""}.`); openExtInfo(entry.id); render(); }
    catch (er) { toast("Mise à jour impossible : " + er.message, 4500); openExtInfo(x.id); } return; }
  const xm = t.closest("[data-xmode]"); if (xm && B) { browse(B.id, xm.dataset.xmode); return; }
  const xit = t.closest("[data-xitem]"); if (xit) { openExtItem(+xit.dataset.xitem); return; }
  const xr = t.closest("[data-xread]"); if (xr) { xr.disabled = true; try { await readExt(+xr.dataset.xread); } catch (er) { toast("Lecture impossible : " + er.message, 4500); xr.disabled = false; } return; }
  const xd = t.closest("[data-xdl]"); if (xd) { xd.disabled = true; await dlExtUI(+xd.dataset.xdl); xd.disabled = false; return; }
  const a = t.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  if (act === "x-back") { B = null; render(); return; }
  if (act === "x-more") { browseMore(); return; }
  if (act === "x-retry") { B.error = ""; browseMore(); return; }
  if (act === "x-dlall") { a.disabled = true; await dlAllUI(); return; }
  if (act === "x-install") { e.preventDefault(); addExtFromField(); return; }
  if (act === "scrim" && t === a) { await saveTitleFromDetail(); closeSheet(); }
  else if (act === "close") { closeSheet(); }
  else if (act === "pick") $("#fileIn").click();
  else if (act === "pick-dir") $("#dirIn").click();
  else if (act === "examples") addExamples();
  else if (act === "do-import") doImport();
  else if (act === "del-ask") openDetail(a.dataset.id, true);
  else if (act === "detail-keep") openDetail($("#sheetRoot").dataset.work);
  else if (act === "del-examples") { for (const w of works.filter(x => x.example)) await DB.del(w.id); await refresh(); toast("Exemples supprimés."); }
  else if (act === "wipe-ask") { $("#wipeConfirm").innerHTML = `<div class="confirm" style="margin-bottom:12px"><span>Supprimer les ${works.length} titres de cet appareil ? C'est définitif.</span><button class="btn" data-act="wipe-no">Annuler</button><button class="btn danger solid" data-act="wipe-yes">Tout supprimer</button></div>`; }
  else if (act === "wipe-no") $("#wipeConfirm").innerHTML = "";
  else if (act === "wipe-yes") { for (const w of works) await DB.del(w.id); await refresh(); toast("Bibliothèque vidée."); }
});
document.addEventListener("input", e => {
  if (e.target.id === "q") { query = e.target.value; const pos = e.target.selectionStart; render(); const q = $("#q"); if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch (x) {} } }
});
document.addEventListener("change", e => {
  if (e.target.id === "sort") { S.sort = e.target.value; saveS(); render(); }
  if (e.target.id === "bookSize") { S.bookSize = +e.target.value; saveS(); }
});
document.addEventListener("submit", e => {
  if (e.target.id === "xForm") { e.preventDefault(); addExtFromField(); }
  if (e.target.id === "xsForm") { e.preventDefault(); const q = $("#xq").value.trim(); if (q && B) browse(B.id, "search", q); }
});
document.addEventListener("focusout", e => { if (e.target.id === "dTitle") saveTitleFromDetail(); });
$("#fileIn").addEventListener("change", e => { prepareImport(e.target.files); e.target.value = ""; });
$("#dirIn").addEventListener("change", e => { prepareImport(e.target.files, true); e.target.value = ""; });
document.addEventListener("dragover", e => { if (e.dataTransfer && [...e.dataTransfer.types].includes("Files")) e.preventDefault(); });
document.addEventListener("drop", e => { if (e.dataTransfer && e.dataTransfer.files.length) { e.preventDefault(); prepareImport(e.dataTransfer.files); } });

/* ================= coque Android ================= */
// Bouton retour de la tablette : la coque appelle cette fonction ; true = géré ici.
window.liseuseBack = () => {
  if (!reader.hidden) { if (!$("#rPanel").hidden) $("#rPanel").hidden = true; else closeReader(); return true; }
  if ($("#sheetRoot").innerHTML) { closeSheet(); return true; }
  if (S.tab === "catalog" && B) { B = null; render(); return true; }
  if (S.tab !== "library") { S.tab = "library"; saveS(); render(); return true; }
  return false;
};
// Bouton d'accueil de la tablette : retour à la bibliothèque, comme sur une liseuse.
window.liseuseHome = () => {
  if (!reader.hidden) closeReader();
  closeSheet();
  if (S.tab !== "library") { S.tab = "library"; saveS(); render(); }
  $("#main").scrollTop = 0;
};
window.liseuseUpdateReady = (v) => {
  updateReady = v || true;
  toast("Nouvelle version de la liseuse téléchargée. Elle s'applique au prochain démarrage.", 4500);
};
let updateReady = false;
function call(fn, ...a) { try { return AND && AND[fn] ? AND[fn](...a) : null; } catch (e) { return null; } }
function openAdmin() {
  const ver = call("webVersion") || "navigateur";
  const app = call("appVersion") || "";
  openSheet(`<h2>Mode avancé</h2>
    <p class="sub">${AND ? "Accès aux réglages de la tablette." : "Ces boutons marchent dans l'appli Android installée sur la tablette."}</p>
    <div class="admin">
      <button class="btn" data-native="openWifi">Wi-Fi</button>
      <button class="btn" data-native="openSettings">Réglages Android</button>
      <button class="btn" data-native="openSamsungHome">Ouvrir l'écran d'accueil Samsung</button>
      <button class="btn" data-native="openHomeSettings">Changer l'écran d'accueil par défaut</button>
      <button class="btn" data-native="checkUpdate">Rechercher une mise à jour</button>
      ${updateReady ? `<button class="btn primary" data-native="reload">Appliquer la mise à jour maintenant</button>` : ""}
    </div>
    <div class="ver">Interface ${esc(ver)}${app ? ` · appli ${esc(app)}` : ""}</div>
    <div class="foot"><button class="btn ghost" data-act="close">Fermer</button></div>`);
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-native]"); if (!b) return;
  if (!AND) { toast("Disponible dans l'appli Android."); return; }
  const fn = b.dataset.native; call(fn);
  if (fn === "checkUpdate") toast("Recherche de mise à jour…");
});
// Geste secret : appui long de 3 secondes sur le logo (ou le titre de la page).
let secretT = 0;
document.addEventListener("pointerdown", e => {
  if (!e.target.closest(".brand, .topbar h1")) return;
  clearTimeout(secretT); secretT = setTimeout(() => { secretT = 0; try { navigator.vibrate && navigator.vibrate(30); } catch (x) {} openAdmin(); }, 3000);
});
["pointerup", "pointercancel", "pointerleave"].forEach(t => document.addEventListener(t, () => { clearTimeout(secretT); }, true));
document.addEventListener("contextmenu", e => { if (e.target.closest(".brand, .topbar h1")) e.preventDefault(); });
// Horloge et batterie, façon liseuse
async function tick() {
  const el = $("#clock"); if (!el) return;
  const now = new Date(); const hm = now.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  let bat = call("battery");
  if (bat == null && navigator.getBattery) { try { const b = await navigator.getBattery(); bat = Math.round(b.level * 100); } catch (e) {} }
  el.innerHTML = `<b>${hm}</b>${bat != null && bat >= 0 ? `${bat} %` : ""}`;
}
tick(); setInterval(tick, 20000);

/* ================= démarrage ================= */
(async () => { await Promise.race([DB.open(), sleep(4000)]); await EXT.load(); await refresh(); call("ready"); setTimeout(() => EXT.autoUpdate(), 4000); })();
window.__liseuse = { DB, R, openReader, refresh, works: () => works, openAdmin, EXT };
})();
</script>
</body>
