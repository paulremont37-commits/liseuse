name: Interfaces en ligne

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'deck/**'
      - 'losc/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assembler le site (liseuse à la racine, Stream Deck dans /deck)
        run: |
          mkdir site
          cp -r web/. site/
          mkdir site/deck site/losc
          cp -r deck/. site/deck/
          cp -r losc/. site/losc/
          python3 - <<'EOF'
          import os, json
          sha = os.environ["GITHUB_SHA"][:7]
          def write(folder, skip=()):
              files = sorted(
                  os.path.relpath(os.path.join(root, f), folder).replace(os.sep, "/")
                  for root, _, names in os.walk(folder) for f in names if f != "version.json"
              )
              files = [f for f in files if not any(f.startswith(s) for s in skip)]
              json.dump({"version": sha, "files": files}, open(os.path.join(folder, "version.json"), "w"))
              print(folder, len(files), "fichiers")
          write("site/deck")
          write("site/losc")
          write("site", skip=("deck/", "losc/"))
          EOF

      # Les applis téléchargent leurs mises à jour d'interface depuis la branche « site »
      # (https://raw.githubusercontent.com/<repo>/site/…) : pas besoin d'activer GitHub Pages.
      - name: Publier sur la branche site
        run: |
          cd site
          git init -q -b site
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Interfaces ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
