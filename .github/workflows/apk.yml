name: Applis (Android + PC)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'agent/**'
      - 'web/**'
      - 'deck/**'
      - 'losc/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compiler les APK
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Erreurs de compilation
        if: failure()
        run: |
          grep -E "error:|e: |What went wrong|Could not|> " build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Renommer
        run: |
          cp android/app/build/outputs/apk/liseuse/release/app-liseuse-release.apk liseuse.apk
          cp android/app/build/outputs/apk/deck/release/app-deck-release.apk stream-deck.apk
          cp android/app/build/outputs/apk/losc/release/app-losc-release.apk dogues.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            liseuse.apk
            stream-deck.apk
            dogues.apk

  pc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fabriquer StreamDeckPC.exe
        run: |
          pip install -r agent/requirements.txt
          pyinstaller --onefile --noconsole --name StreamDeckPC --icon agent/icon.ico --paths agent --hidden-import gui --hidden-import media --collect-submodules winrt --hidden-import winrt.windows.foundation --hidden-import winrt.windows.foundation.collections --hidden-import winrt.windows.storage.streams --hidden-import winrt.windows.media.control --add-data "agent/ui.html;." --add-data "agent/icon.ico;." --add-data "agent/bricolage-800.woff2;." agent/agent.py

      - name: Vérifier la musique en cours avant compilation
        shell: pwsh
        run: |
          python agent/agent.py --selftest
          Get-Content selftest.txt

      - name: Vérifier l'exe (musique en cours et fenêtre inclus)
        shell: pwsh
        run: |
          Start-Process -FilePath dist\StreamDeckPC.exe -ArgumentList "--selftest" -Wait
          Get-Content selftest.txt
          $r = Get-Content selftest.txt | ConvertFrom-Json
          if ($r.media_import -ne "ok") { Write-Output "::error::Musique en cours absente de l'exe : $($r.media_import)"; exit 1 }
          if ($r.gui_import -ne "ok") { Write-Output "::error::Fenêtre absente de l'exe : $($r.gui_import)"; exit 1 }
          if ($r.media_read -is [string] -and $r.media_read -match "ModuleNotFound|ImportError") { Write-Output "::error::Module manquant pour la musique : $($r.media_read)"; exit 1 }
          if ($r.media_read -is [string]) { Write-Output "::warning::Lecture de la musique sur la machine de compilation : $($r.media_read)" }

      - uses: actions/upload-artifact@v4
        with:
          name: pc
          path: dist/StreamDeckPC.exe

  release:
    needs: [android, pc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Version 1.0.${{ github.run_number }}
          make_latest: true
          files: |
            liseuse.apk
            stream-deck.apk
            dogues.apk
            StreamDeckPC.exe
          body: |
            - **liseuse.apk** : la liseuse (mangas, BD, livres), pour la tablette.
            - **stream-deck.apk** : le Stream Deck, pour la tablette.
            - **StreamDeckPC.exe** : le programme à lancer sur le PC pour le Stream Deck.
            - **dogues.apk** : l'appli de fan LOSC (non officielle) : actus, matchs en direct, compos, absents, classement.
