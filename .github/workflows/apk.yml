name: Appli Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compiler l'APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Renommer
        run: cp android/app/build/outputs/apk/release/app-release.apk liseuse.apk

      - uses: actions/upload-artifact@v4
        with:
          name: liseuse-apk
          path: liseuse.apk

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Liseuse 1.0.${{ github.run_number }}
          make_latest: true
          files: liseuse.apk
          body: |
            Télécharge **liseuse.apk** depuis la tablette, puis installe-le.
            L'interface se met à jour toute seule ensuite : pas besoin de réinstaller l'APK à chaque changement.
