<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Stream Deck</title>
<style>
@font-face{font-family:'Bricolage Grotesque';src:url(fonts/bricolage-grotesque-latin-800-normal.woff2) format('woff2');font-weight:800;font-display:swap}
@font-face{font-family:'Inter';src:url(fonts/inter-latin-500-normal.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Inter';src:url(fonts/inter-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'Inter';src:url(fonts/inter-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:swap}
/* Console de jeu : fond ardoise, une couleur par famille de boutons (voix, sons, clip, musique), grille qui remplit l'écran */
:root{
  --bg:#000; --panel:#08080c; --panel-2:#111118; --line:#1e1e2a; --fg:#f4f6ff; --muted:#7d8094;
  --voice:#8a6bff; --mod:#00ffa3; --sound:#ffc21a; --clip:#ff2d6b; --music:#00e5ff; --plain:#c8cede; --pink:#ff3ccf; --lime:#b8ff2e;
  --ok:#00ffa3; --bad:#ff2d6b;
  --f-display:'Bricolage Grotesque','Inter',system-ui,sans-serif;
  --f-ui:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;padding:env(safe-area-inset-top,0px) max(14px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(14px,env(safe-area-inset-left,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sound);outline-offset:2px}
[hidden]{display:none!important}

.shell{height:100%;display:flex;flex-direction:column;gap:12px;padding-block:12px}
.bar{display:flex;align-items:center;gap:10px;min-height:48px}
.status{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:999px;height:44px;padding:0 16px 0 12px;font-weight:600;min-width:0;max-width:40%}
.status span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:12px;height:12px;border-radius:50%;background:var(--muted);flex:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--muted) 20%,transparent)}
.status.on .dot{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 22%,transparent)}
.status.wait .dot{background:var(--sound);animation:blink 1s 8}
.status.err .dot{background:var(--bad)}
@keyframes blink{50%{opacity:.35}}
.tabs{flex:1;display:flex;justify-content:center;gap:6px;min-width:0;overflow-x:auto;scrollbar-width:none}
.tab{height:44px;border-radius:12px;border:0;background:none;padding:0 18px;font-weight:700;color:var(--muted);white-space:nowrap}
.tab[aria-current="true"]{background:var(--panel-2);color:var(--fg)}
.clock{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;padding:0 6px}
.ib{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;flex:none}
.ib svg{width:22px;height:22px}
.ib[aria-pressed="true"]{background:var(--sound);color:#1b1205;border-color:transparent}

.grid{flex:1;min-height:0;display:grid;gap:14px}
.tile{position:relative;border-radius:24px;border:2px solid color-mix(in srgb,var(--c) 40%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--c) 16%,var(--panel)) 0%,var(--panel) 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px;min-width:0;min-height:0;overflow:hidden;touch-action:manipulation;transition:transform .08s ease,background .15s,border-color .15s}
.tile svg{width:clamp(28px,34%,72px);height:auto;aspect-ratio:1;color:var(--c);flex:none}
.tile .lbl{font-weight:700;font-size:clamp(13px,1.6vw,19px);line-height:1.15;text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.tile .keys{position:absolute;bottom:8px;right:12px;font-size:11px;color:var(--muted);font-weight:600;opacity:0;transition:opacity .15s}
.editing .tile .keys{opacity:1}
.tile.down{transform:scale(.94)}
.tile.on{background:color-mix(in srgb,var(--oc) 30%,var(--panel));border-color:var(--oc)}
.tile.on svg{color:var(--oc)}
.tile .flag{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--oc);color:#12080a;display:none;white-space:nowrap}
.tile.on .flag{display:block}
.tile.ok::after,.tile.fail::after{content:"";position:absolute;inset:0;border-radius:22px;animation:flash .5s ease forwards}
.tile.ok::after{box-shadow:inset 0 0 0 4px var(--ok)}
.tile.fail::after{box-shadow:inset 0 0 0 4px var(--bad)}
@keyframes flash{from{opacity:1}to{opacity:0}}
.tile.add{border-style:dashed;background:none;--c:var(--muted)}
.tile.ghost{visibility:hidden}
/* widget musique */
.tile.media{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;align-items:center;justify-items:stretch;gap:10px 14px;padding:14px;text-align:left}
.tile.media .mbg{position:absolute;inset:-20px;background:center/cover no-repeat;filter:blur(26px) saturate(1.4);opacity:.32;pointer-events:none}
.tile.media > *{position:relative}
.tile.media .mart{width:clamp(52px,7.5vw,96px);aspect-ratio:1;border-radius:14px;overflow:hidden;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 10%,#000);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);box-shadow:0 0 22px -8px var(--c);align-self:center}
.tile.media .mart img{width:100%;height:100%;object-fit:cover;display:block}
.tile.media .mart svg{width:44%;height:auto;color:var(--c);filter:drop-shadow(0 0 6px var(--c))}
.tile.media .minfo{min-width:0;display:flex;flex-direction:column;gap:3px}
.tile.media .mapp{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--c);text-shadow:0 0 8px color-mix(in srgb,var(--c) 70%,transparent)}
.tile.media .mapp:empty{display:none}
.tile.media .mt{font-family:var(--f-display);font-weight:800;font-size:clamp(15px,1.9vw,24px);line-height:1.12;letter-spacing:-.01em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.tile.media .ma{color:var(--muted);font-weight:600;font-size:clamp(12px,1.3vw,15px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.media .mbar{height:4px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:8px;overflow:hidden}
.tile.media .mbar i{display:block;height:100%;width:0;background:var(--c);box-shadow:0 0 10px var(--c);border-radius:3px;transition:width .5s linear}
.tile.media .mctl{grid-column:1 / -1;display:flex;justify-content:center;gap:clamp(6px,2vw,22px)}
.tile.media .mctl button{width:clamp(40px,4.6vw,56px);height:clamp(40px,4.6vw,56px);border-radius:50%;border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent);background:#000;color:var(--fg);display:grid;place-items:center;transition:transform .08s,box-shadow .15s}
.tile.media .mctl button svg{width:44%;height:44%}
.tile.media .mctl .pp{border-color:var(--c);color:var(--c);box-shadow:0 0 16px -4px var(--c)}
.tile.media .mctl button.down{transform:scale(.88);box-shadow:0 0 22px -2px var(--c)}
.tile.media.wide{grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;align-content:center;padding:14px 22px;column-gap:20px;row-gap:10px}
.tile.media.wide .mart{grid-row:1 / span 2;width:clamp(64px,10vw,140px);max-height:100%}
.tile.media.wide .mt{-webkit-line-clamp:1}
.tile.media.wide .mctl{grid-column:2;justify-content:flex-start}
.tile.media.wide .mctl button{width:clamp(36px,3.8vw,50px);height:clamp(36px,3.8vw,50px)}
.tile.media{align-content:center}
.tile.media:not(.wide) .mart{grid-row:1}
.tile.media.idle .mt{color:var(--muted)}
.tile.media.idle .mctl button{opacity:.45}
.tile.media.playing .mart{box-shadow:0 0 28px -6px var(--c)}
.tile.media.w3{padding:16px 26px;column-gap:26px}
.tile.media.w3 .mart{width:clamp(72px,13vw,190px)}
.tile.media.w3 .mt{-webkit-line-clamp:2;font-size:clamp(17px,2.3vw,30px)}
.tile.media.w3 .ma{font-size:clamp(13px,1.5vw,18px)}
.tile.media.w3 .mctl button{width:clamp(40px,4.4vw,58px);height:clamp(40px,4.4vw,58px)}
.tile.mixertile .keys{opacity:1}
.sheet.mixer{width:min(900px,100%);padding:20px 22px 24px}
.mxhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.mxhead h2{display:flex;align-items:center;gap:10px;margin:0}.mxhead h2 svg{width:26px;height:26px;color:var(--mod);filter:drop-shadow(0 0 6px var(--mod))}
.mxpc{color:var(--muted);font-weight:600;margin-right:auto}
.mxh{margin:18px 0 6px}
.mxnote{color:var(--muted);line-height:1.5;margin:14px 0}
.mrow{display:grid;grid-template-columns:44px minmax(90px,170px) minmax(0,1fr) 40px 52px;align-items:center;gap:14px;padding:8px 0;border-top:1px solid var(--line)}
.mrow.big{border-top:0;padding:6px 0 14px}
.mbadge{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--c);border:1.5px solid color-mix(in srgb,var(--c) 60%,transparent);box-shadow:0 0 14px -4px var(--c),inset 0 0 12px -6px var(--c);text-shadow:0 0 8px var(--c)}
.mbadge svg{width:22px;height:22px}
.mname{min-width:0}.mname b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mname small{color:var(--muted);font-size:12.5px}
.mval{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;color:var(--c)}
.mrow input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:48px;background:transparent;margin:0;touch-action:none}
.mrow input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:5px;background:linear-gradient(90deg,var(--c) 0 var(--p),rgba(255,255,255,.12) var(--p) 100%);box-shadow:0 0 12px -3px var(--c)}
.mrow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-11px;border-radius:50%;background:#000;border:3px solid var(--c);box-shadow:0 0 14px var(--c)}
.mrow input[type=range]::-moz-range-track{height:8px;border-radius:5px;background:linear-gradient(90deg,var(--c) 0 var(--p),rgba(255,255,255,.12) var(--p) 100%)}
.mrow input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#000;border:3px solid var(--c)}
.mmute{width:52px;height:46px;border-radius:13px;border:1px solid var(--line);background:#0b0b11;display:grid;place-items:center;color:var(--fg)}
.mmute svg{width:22px;height:22px}
.mmute[aria-pressed="true"]{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 60%,transparent);box-shadow:0 0 14px -4px var(--bad)}
.mrow.muted input[type=range]{opacity:.35}.mrow.muted .mval{color:var(--muted)}
.mrow.big .mname b{font-size:17px}
@media (max-width:640px){.mrow{grid-template-columns:40px minmax(0,1fr) 46px;grid-template-areas:"b n m" "r r v"}.mbadge{grid-area:b;width:40px;height:40px}.mname{grid-area:n}.mmute{grid-area:m;width:46px}.mrow input[type=range]{grid-area:r}.mval{grid-area:v}}
.bat{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px;color:var(--fg);font-variant-numeric:tabular-nums;--bc:var(--ok)}
.bat .bshape{position:relative;width:30px;height:15px;border:2px solid var(--bc);border-radius:4px;padding:1.5px;box-shadow:0 0 8px -2px var(--bc)}
.bat .bshape::after{content:"";position:absolute;right:-5px;top:3px;width:3px;height:5px;border-radius:0 2px 2px 0;background:var(--bc)}
.bat .bshape i{display:block;height:100%;border-radius:2px;background:var(--bc);box-shadow:0 0 6px var(--bc)}
.bat.mid{--bc:var(--sound)}.bat.low{--bc:var(--bad)}.bat.chg{--bc:var(--music)}
.bat.chg b::before{content:"⚡";margin-right:2px;color:var(--music)}
@media (max-width:640px){.bat b{display:none}}
#sleep{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#3a3d4f;touch-action:none}
#sleep .sclock{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,14vw,180px);letter-spacing:-.02em;color:color-mix(in srgb,var(--music) 45%,#000)}
#sleep .sbat{font-weight:700;font-size:22px;color:#4a4d60}
#sleep p{margin:16px 0 0;font-size:14px}
body.asleep *,body.asleep *::before,body.asleep *::after{animation:none!important;transition:none!important}
.tile.rltile{align-items:stretch;justify-content:space-between;gap:8px;padding:14px 16px;text-align:left}
.rlh{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--c);text-shadow:0 0 8px color-mix(in srgb,var(--c) 70%,transparent)}
.rlh svg{width:20px!important;height:20px;flex:none}
.rlh small{margin-left:auto;color:var(--ok);letter-spacing:.06em;text-shadow:0 0 8px var(--ok)}
.rlbody{display:flex;flex-direction:column;gap:7px;min-width:0}
.tile.rltile.wide .rlbody{flex-direction:row;flex-wrap:wrap;align-items:center;column-gap:16px}
.rlwl{display:flex;gap:12px;font-family:var(--f-display);font-weight:800;font-size:clamp(20px,2.6vw,34px);letter-spacing:.01em;line-height:1}
.rlwl .w,.rlmodes .w,#sleep .w{color:var(--ok);text-shadow:0 0 14px color-mix(in srgb,var(--ok) 55%,transparent)}
.rlwl .l,.rlmodes .l,#sleep .l{color:var(--bad);text-shadow:0 0 14px color-mix(in srgb,var(--bad) 55%,transparent)}
.rls{align-self:flex-start;font-size:12.5px;font-weight:800;border-radius:8px;padding:3px 9px;border:1.5px solid}
.rls.up{color:var(--ok);border-color:var(--ok);box-shadow:0 0 10px -3px var(--ok)}
.rls.down{color:var(--bad);border-color:var(--bad);box-shadow:0 0 10px -3px var(--bad)}
.rldots{display:flex;gap:5px;align-items:center}
.rldots i{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.rldots i.w{background:var(--ok);box-shadow:0 0 6px var(--ok)}.rldots i.l{background:var(--bad);box-shadow:0 0 6px var(--bad)}
.rltot{color:var(--muted);font-weight:600;font-size:13px;width:100%}
.rlidle{color:var(--muted);font-weight:600;font-size:14px;line-height:1.35}
.sheet.rlsheet{width:min(900px,100%)}
.rlbig{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:6px 0 14px}
.rlbig .rlwl{font-size:44px}
.rlgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.rlstat{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#06060a}
.rlstat b{display:block;font-family:var(--f-display);font-weight:800;font-size:26px;color:var(--fg)}
.rlstat span{color:var(--muted);font-size:12.5px}
.rlmodes{display:flex;flex-wrap:wrap;gap:8px}
.rlmodes div{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.rlmodes span{font-weight:600}
.rllast{display:flex;flex-direction:column}
.rllast > div{display:grid;grid-template-columns:34px minmax(0,1fr) 110px 150px 56px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.rllast .rr{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;border:1.5px solid var(--muted);color:var(--muted)}
.rllast .w .rr{border-color:var(--ok);color:var(--ok);box-shadow:0 0 10px -3px var(--ok)}
.rllast .l .rr{border-color:var(--bad);color:var(--bad);box-shadow:0 0 10px -3px var(--bad)}
.rllast .rm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rllast .rs{font-variant-numeric:tabular-nums;font-weight:700}
.rllast .rme,.rllast .rt{color:var(--muted);font-size:13px}
@media (max-width:640px){.rlgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.rllast > div{grid-template-columns:30px minmax(0,1fr) auto}.rllast .rme,.rllast .rt{display:none}}
#sleep .srl{display:flex;align-items:center;gap:14px;font-family:var(--f-display);font-weight:800;font-size:24px;margin-top:6px;opacity:.75}
#sleep .srl:empty{display:none}
#sleep .srl > span:first-child{font-family:var(--f-ui);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#4a4d60}
.hint-s{color:var(--muted);font-size:13px;margin:8px 0 0}
.grid{will-change:transform}
/* La grille gère elle-même les gestes : sans ça, Android « vole » le glissé pour faire défiler
   et annule le swipe (pointercancel). */
.grid,.grid *{touch-action:none}
.editing .tile{touch-action:none}
.tile.slot{border:2px dashed var(--line);background:none;box-shadow:none;--c:var(--muted);opacity:.55}
.tile.slot svg{width:clamp(22px,22%,40px);filter:none}
.dragmode .tile.slot{opacity:.9}
.tile.lifted{opacity:.18;animation:none!important}
.tile.dragging{position:fixed;z-index:40;margin:0;pointer-events:none;animation:none!important;border-color:var(--c);box-shadow:0 0 40px -4px var(--c),0 18px 40px rgba(0,0,0,.8),inset 0 0 40px -10px var(--c);transition:none}
.tile.drop{border-style:solid;border-color:var(--music)!important;opacity:1;box-shadow:0 0 0 2px var(--music),0 0 26px -2px var(--music)!important}
.tab.drop{color:var(--music);background:color-mix(in srgb,var(--music) 14%,transparent);box-shadow:0 0 16px -4px var(--music)}
.editing .tile:not(.slot){animation:wob 1.6s ease-in-out infinite}
.editing .tile:nth-child(2n){animation-delay:-.8s}
@keyframes wob{50%{transform:rotate(.6deg)}}

/* écran de connexion */
.setup{flex:1;display:grid;place-items:center;overflow:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:28px;width:min(680px,100%)}
.card h1{font-family:var(--f-display);font-weight:800;font-size:34px;letter-spacing:-.035em;margin:0 0 8px}
.card p{color:var(--muted);margin:0 0 18px;line-height:1.5}
.steps{margin:0 0 22px;padding-left:22px;color:var(--muted);line-height:1.6}
.steps b{color:var(--fg)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;flex:1 1 200px;min-width:0}
.field span{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field input,.field select{height:56px;border-radius:14px;border:1px solid var(--line);background:var(--panel-2);padding:0 16px;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;min-width:0;width:100%;user-select:text;-webkit-user-select:text}
.err{color:var(--bad);font-weight:600;min-height:22px;margin:12px 0 0}
.btn{height:52px;border-radius:14px;border:1px solid var(--line);background:var(--panel-2);padding:0 20px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.primary{background:var(--sound);color:#1b1205;border-color:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:none}
.btn.danger.solid{background:var(--bad);color:#1a0508}

/* feuilles */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(5,7,10,.7);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:26px;width:min(760px,100%);max-height:100%;overflow:auto;padding:22px}
.sheet h2{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.03em;margin:0 0 14px}
.sheet h3{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:44px;min-width:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);padding:0 14px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid transparent;background:var(--c)}
.sw[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 3px var(--bg) inset}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px}
.icons button{height:56px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);display:grid;place-items:center}
.icons button svg{width:26px;height:26px}
.icons button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:22px}
.foot .left{margin-right:auto}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.toggle-row small{display:block;color:var(--muted)}
.switch{width:56px;height:32px;border-radius:16px;border:0;background:var(--panel-2);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:transform .2s}
.switch[aria-checked="true"]{background:color-mix(in srgb,var(--sound) 45%,var(--panel-2))}
.switch[aria-checked="true"]::after{transform:translateX(24px);background:var(--sound)}
.preview{display:inline-flex;align-items:center;gap:8px;font-weight:700;background:var(--panel-2);border-radius:10px;padding:8px 12px;margin-top:10px;font-variant-numeric:tabular-nums}
.help{background:var(--panel-2);border-radius:16px;padding:14px 16px;color:var(--muted);line-height:1.55}
.help b{color:var(--fg)}
.help ol{margin:6px 0 0;padding-left:20px}
.guide details{border-top:1px solid var(--line)}
.guide details:first-of-type{border-top:0}
.guide summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;font-weight:700;font-size:16px}
.guide summary::-webkit-details-marker{display:none}
.guide summary::after{content:"+";font-size:24px;line-height:1;color:var(--muted);transition:transform .2s}
.guide details[open] summary::after{transform:rotate(45deg)}
.guide .gbody{padding:0 0 18px;color:var(--muted);line-height:1.6}
.guide .gbody b{color:var(--fg)}
.guide ol,.guide ul{margin:6px 0 0;padding-left:22px}
.guide li{margin:4px 0}
.guide kbd{font-family:var(--f-ui);font-size:13px;font-weight:700;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--fg)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--bad) 14%,transparent);border-radius:14px;padding:10px 12px;margin-top:12px}
.confirm span{flex:1 1 200px;font-weight:600}
.toasts{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(520px,calc(100% - 32px))}
.toast{background:#262d38;border-radius:14px;padding:12px 16px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);text-align:center}
/* ---------------- DA néon : fond noir, chaque bouton est un tube lumineux de sa couleur ---------------- */
.status{background:#000;border-color:var(--line)}
.status.on{border-color:color-mix(in srgb,var(--ok) 55%,transparent);box-shadow:0 0 16px -6px var(--ok)}
.status.on .dot{box-shadow:0 0 10px var(--ok),0 0 0 4px color-mix(in srgb,var(--ok) 18%,transparent)}
.status.err .dot{box-shadow:0 0 10px var(--bad)}
.tab{color:var(--muted);letter-spacing:.02em;position:relative}
.tab[aria-current="true"]{background:none;color:var(--fg);text-shadow:0 0 12px rgba(255,255,255,.55)}
.tab[aria-current="true"]::after{content:"";position:absolute;left:18px;right:18px;bottom:6px;height:3px;border-radius:3px;background:var(--music);box-shadow:0 0 10px var(--music),0 0 20px var(--music)}
.clock{color:var(--music);text-shadow:0 0 14px color-mix(in srgb,var(--music) 70%,transparent)}
.ib{background:#000;border-color:var(--line)}
.ib[aria-pressed="true"]{background:#000;color:var(--sound);border-color:var(--sound);box-shadow:0 0 14px -2px var(--sound),inset 0 0 12px -4px var(--sound)}
.tile{background:#000;border:2px solid color-mix(in srgb,var(--c) 65%,transparent);
  box-shadow:0 0 22px -8px var(--c),inset 0 0 26px -14px var(--c);transition:transform .08s ease,box-shadow .15s,border-color .15s,background .15s}
.tile svg{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--c) 80%,transparent))}
.tile .lbl{color:var(--fg);text-shadow:0 0 10px color-mix(in srgb,var(--c) 45%,transparent)}
.tile.down{transform:scale(.95);border-color:var(--c);box-shadow:0 0 34px -4px var(--c),inset 0 0 40px -10px var(--c)}
.tile.on{background:color-mix(in srgb,var(--oc) 12%,#000);border-color:var(--oc);box-shadow:0 0 30px -4px var(--oc),0 0 70px -24px var(--oc),inset 0 0 36px -10px var(--oc)}
.tile.on svg{filter:drop-shadow(0 0 10px var(--oc))}
.tile .flag{background:#000;color:var(--oc);border:1.5px solid var(--oc);box-shadow:0 0 10px -2px var(--oc);text-shadow:0 0 8px var(--oc)}
.tile.ok::after{box-shadow:inset 0 0 0 3px var(--ok),inset 0 0 30px -6px var(--ok)}
.tile.fail::after{box-shadow:inset 0 0 0 3px var(--bad),inset 0 0 30px -6px var(--bad)}
.tile.add{box-shadow:none;border-color:var(--line)}
.tile.add svg{filter:none}
.card,.sheet{background:#05050a;border-color:var(--line);box-shadow:0 0 0 1px rgba(255,255,255,.02),0 30px 80px -20px rgba(0,0,0,.9)}
.sheet{border-top:2px solid var(--music);box-shadow:0 -6px 30px -14px var(--music),0 30px 80px -20px #000}
.scrim{background:rgba(0,0,0,.78)}
.btn,.chip,.field input,.field select,.icons button,.preview,.help{background:#0b0b11}
.btn.primary{background:var(--sound);color:#140e00;box-shadow:0 0 18px -4px var(--sound)}
.chip[aria-pressed="true"],.icons button[aria-pressed="true"]{background:#000;color:var(--music);border-color:var(--music);box-shadow:0 0 12px -3px var(--music),inset 0 0 10px -5px var(--music)}
.sw{box-shadow:0 0 12px -3px var(--c)}
.sw[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 3px #000 inset,0 0 16px var(--c)}
.switch[aria-checked="true"]::after{box-shadow:0 0 10px var(--sound)}
.toast{background:#0b0b11;border:1px solid var(--line);box-shadow:0 0 24px -10px var(--music),0 10px 30px rgba(0,0,0,.6)}
:focus-visible{outline-color:var(--music)}
@media (max-width:640px){.clock{display:none}.status{max-width:none}.grid{gap:10px}.tile{border-radius:18px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header class="bar">
    <div class="status" id="status"><i class="dot"></i><span id="statusTxt">Hors ligne</span></div>
    <nav class="tabs" id="tabs" aria-label="Pages"></nav>
    <div class="bat" id="bat" hidden><span class="bshape"><i></i></span><b id="batTxt"></b></div>
    <div class="clock" id="clock"></div>
    <button class="ib" id="mixBtn" aria-label="Mixer : volume de chaque appli"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></button>
    <button class="ib" id="editBtn" aria-pressed="false" aria-label="Modifier les boutons"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg></button>
    <button class="ib" id="setBtn" aria-label="Réglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
  </header>
  <main class="grid" id="grid"></main>
  <section class="setup" id="setup" hidden></section>
</div>
<div id="sheetRoot"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const AND = window.Android || null;
const call = (fn, ...a) => { try { return AND && AND[fn] ? AND[fn](...a) : null; } catch (e) { return null; } };
const uid = () => Math.random().toString(36).slice(2, 10);
function toast(m, ms = 2400) { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; $("#toasts").appendChild(t); setTimeout(() => t.remove(), ms); }

/* ---------------- icônes (génériques, aucune marque) ---------------- */
const P = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICONS = {
  mic: P('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>'),
  headset: P('<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>'),
  voice: P('<path d="M3 12h2M7 8v8M11 5v14M15 8v8M19 10v4M21 12h0"/>'),
  mask: P('<path d="M4 6c3-1.5 13-1.5 16 0v5c0 5-3.5 9-8 9s-8-4-8-9z"/><path d="M8 11h2M14 11h2M9 15c2 1.5 4 1.5 6 0"/>'),
  clip: P('<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/><circle cx="9.5" cy="12" r="2" fill="currentColor"/>'),
  stop: P('<rect x="6" y="6" width="12" height="12" rx="2"/>'),
  sound: P('<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>'),
  horn: P('<path d="M3 10v4l11 5V5z"/><path d="M14 9h3a3 3 0 0 1 0 6h-3"/><path d="M6 14l1 5h3l-1-4.5"/>'),
  laugh: P('<circle cx="12" cy="12" r="9"/><path d="M8 10h.01M16 10h.01M7.5 14a5 5 0 0 0 9 0z"/>'),
  bolt: P('<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>'),
  star: P('<path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/>'),
  trophy: P('<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 21h8M10 17h4"/>'),
  car: P('<path d="M5 16l1.5-5a2 2 0 0 1 2-1.5h7a2 2 0 0 1 2 1.5L19 16"/><rect x="3" y="16" width="18" height="3" rx="1.5"/><circle cx="7" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/>'),
  ball: P('<circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 5h-5L8 10z"/>'),
  playpause: P('<path d="M5 5v14l8-7z"/><path d="M16 6v12M20 6v12"/>'),
  next: P('<path d="M5 5v14l9-7z"/><path d="M18 5v14"/>'),
  prev: P('<path d="M19 5v14l-9-7z"/><path d="M6 5v14"/>'),
  volup: P('<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9v6M14 12h6"/>'),
  voldown: P('<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M15 12h6"/>'),
  volmute: P('<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9l5 6M21 9l-5 6"/>'),
  music: P('<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>'),
  sliders: P('<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>'),
  chat: P('<path d="M4 5h16v11H9l-5 4z"/>'),
  camera: P('<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>'),
  keyboard: P('<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>')
};
const PLUS = P('<path d="M12 5v14M5 12h14"/>');
const COLORS = { voice: "var(--voice)", mod: "var(--mod)", sound: "var(--sound)", clip: "var(--clip)", music: "var(--music)", pink: "var(--pink)", lime: "var(--lime)", plain: "var(--plain)" };
const MEDIA = { media_play_pause: "Lecture / pause", media_next: "Morceau suivant", media_prev: "Morceau précédent", volume_up: "Volume +", volume_down: "Volume −", volume_mute: "Couper le son du PC" };
const KEYNAME = { ctrl: "Ctrl", alt: "Alt", shift: "Maj", win: "Win" };
const describe = k => k.map(x => KEYNAME[x] || MEDIA[x] || x.toUpperCase()).join(" + ");

/* ---------------- boutons par défaut ---------------- */
function defaults() {
  const t = (label, icon, color, keys, extra = {}) => ({ id: uid(), label, icon, color, keys, ...extra });
  const sounds = [["Son 1", "horn"], ["Son 2", "laugh"], ["Son 3", "bolt"], ["Son 4", "star"], ["Son 5", "trophy"], ["Son 6", "car"], ["Son 7", "ball"], ["Son 8", "sound"]];
  return [
    { id: uid(), name: "Jeu", tiles: [
      t("Micro", "mic", "voice", ["ctrl", "alt", "f13"], { toggle: true, onLabel: "Coupé", onColor: "clip" }),
      t("Casque", "headset", "voice", ["ctrl", "alt", "f14"], { toggle: true, onLabel: "Sourdine", onColor: "clip" }),
      t("Voix", "mask", "mod", ["ctrl", "alt", "f15"], { toggle: true, onLabel: "Activée", onColor: "mod" }),
      t("Clip", "clip", "clip", ["ctrl", "alt", "f16"]),
      t("Stop sons", "stop", "sound", ["ctrl", "alt", "f17"]),
      ...sounds.map(([l, i], k) => t(l, i, "sound", ["ctrl", "shift", "f" + (13 + k)])),
      t("Lecture / pause", "playpause", "music", ["media_play_pause"]),
      t("Suivant", "next", "music", ["media_next"])
    ]},
    { id: uid(), name: "Musique & PC", tiles: [
      t("Précédent", "prev", "music", ["media_prev"]),
      t("Lecture / pause", "playpause", "music", ["media_play_pause"]),
      t("Suivant", "next", "music", ["media_next"]),
      t("Volume −", "voldown", "plain", ["volume_down"]),
      t("Volume +", "volup", "plain", ["volume_up"]),
      t("Couper le PC", "volmute", "plain", ["volume_mute"], { toggle: true, onLabel: "Muet", onColor: "clip" })
    ]}
  ];
}

/* ---------------- état ---------------- */
let st = { pc: null, code: "", cols: 5, pages: defaults(), page: 0, states: {}, seenHelp: false, sleep: 60 };
try { const s = JSON.parse(localStorage.getItem("deck.v1") || "null"); if (s && Array.isArray(s.pages)) st = Object.assign(st, s); } catch (e) {}
// Une page = une liste de cases ; null = case vide (les boutons gardent la place où on les a mis).
const trimPages = () => st.pages.forEach(p => { p.tiles = p.tiles || []; while (p.tiles.length && !p.tiles[p.tiles.length - 1]) p.tiles.pop(); });
const save = () => { trimPages(); try { localStorage.setItem("deck.v1", JSON.stringify(st)); } catch (e) {} };
let editing = false;

/* ---------------- connexion au PC ---------------- */
// Sous Android, la coque gère la connexion (le navigateur intégré bloque ws:// depuis une page sécurisée).
const nativeSocks = {};
window.__deckWs = (id, ev, data) => { const s = nativeSocks[id]; if (!s) return; if (ev === "open") s.onopen && s.onopen(); else if (ev === "message") s.onmessage && s.onmessage({ data }); else { delete nativeSocks[id]; s.onclose && s.onclose({ reason: data }); } };
let sockSeq = 1;
function openSocket(url) {
  if (AND && AND.wsConnect) {
    const id = sockSeq++; const s = { readyState: 0, send: d => call("wsSend", id, d), close: () => { call("wsClose", id); delete nativeSocks[id]; } };
    nativeSocks[id] = s; call("wsConnect", id, url); return s;
  }
  return new WebSocket(url);
}
const C = { ws: null, state: "off", name: "", retry: 0, timer: 0, pending: new Map(), seq: 1, lastErr: "", rtt: 0, pings: new Map() };
function setStatus(state, txt) {
  C.state = state; const el = $("#status"); el.className = "status " + ({ on: "on", wait: "wait", err: "err" }[state] || "");
  $("#statusTxt").textContent = txt;
  if (typeof paintMedia === "function") try { paintMedia(); } catch (e) {}
}
// Temps aller-retour tablette → PC, affiché à côté du nom du PC
function noteRtt(ms) {
  C.rtt = C.rtt ? Math.round(C.rtt * 0.6 + ms * 0.4) : Math.round(ms);
  if (C.state === "on") $("#statusTxt").textContent = `${C.name} connecté · ${Math.max(1, C.rtt)} ms`;
}
function connect() {
  clearTimeout(C.timer);
  if (C.ws) { try { C.ws.onclose = null; C.ws.close(); } catch (e) {} C.ws = null; }
  if (!st.pc) { setStatus("off", "Pas de PC"); return; }
  setStatus("wait", "Connexion…");
  let ws; try { ws = openSocket(`ws://${st.pc}:8765`); } catch (e) { return later(); }
  C.ws = ws;
  ws.onopen = () => ws.send(JSON.stringify({ type: "hello", code: st.code }));
  ws.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.type === "ok") { C.retry = 0; C.name = m.name || "PC"; C.lastErr = ""; C.rtt = 0; setStatus("on", C.name + " connecté"); if (!$("#setup").hidden) showDeck(); ping(); }
    else if (m.type === "pong") { const t0 = C.pings.get(m.id); if (t0) { C.pings.delete(m.id); noteRtt(performance.now() - t0); } }
    else if (m.type === "error") { C.lastErr = m.reason || "refusé"; setStatus("err", "Code refusé"); if (!$("#setup").hidden) $("#setErr").textContent = "Le PC a refusé : " + C.lastErr + "."; ws.onclose = null; try { ws.close(); } catch (e) {} C.ws = null; }
    else if (m.type === "result") { const p = C.pending.get(m.id); if (p) { C.pending.delete(m.id); p(m.ok, m.reason); } }
    else if (m.type === "media") onMedia(m);
    else if (m.type === "mixer") onMixer(m);
    else if (m.type === "rl") onRl(m);
  };
  ws.onclose = () => { C.ws = null; if (C.state === "on") toast("Connexion au PC perdue. Nouvelle tentative…"); later(); };
}
function later() {
  setStatus(C.lastErr ? "err" : "wait", C.lastErr ? "Code refusé" : "PC introuvable");
  if (C.lastErr) return;
  C.retry = Math.min(C.retry + 1, 5); C.timer = setTimeout(connect, [1500, 2000, 3000, 4000, 5000][C.retry - 1]);
}
function sendKeys(keys, label) {
  return new Promise(res => {
    if (C.state !== "on" || !C.ws) return res({ ok: false, reason: "PC non connecté" });
    const id = C.seq++; const t0 = performance.now();
    // Envoi en premier : rien ne doit passer avant le message
    C.ws.send(JSON.stringify({ type: "press", id, keys, label }));
    const t = setTimeout(() => { C.pending.delete(id); res({ ok: false, reason: "pas de réponse du PC" }); }, 2500);
    C.pending.set(id, (ok, reason) => { clearTimeout(t); noteRtt(performance.now() - t0); res({ ok, reason }); });
  });
}
function ping() {
  if (C.state !== "on" || !C.ws) return;
  const id = C.seq++; C.pings.set(id, performance.now()); if (C.pings.size > 20) C.pings.clear();
  try { C.ws.send(JSON.stringify({ type: "ping", id })); } catch (e) {}
}
// Un petit message régulier garde la connexion (et le Wi-Fi) éveillés entre deux appuis
let pingT = setInterval(ping, 5000);
function pingEvery(ms) { clearInterval(pingT); pingT = setInterval(ping, ms); }
document.addEventListener("visibilitychange", () => { if (!document.hidden && C.state !== "on" && st.pc) connect(); });

/* ---------------- rendu ---------------- */
function renderTabs() {
  $("#tabs").innerHTML = st.pages.map((p, i) => `<button class="tab" data-page="${i}" aria-current="${i === st.page}">${esc(p.name)}</button>`).join("") +
    (editing ? `<button class="tab" data-act="add-page">+ Page</button>` : "");
}
function tileHTML(t, span) {
  if (t.kind === "media") return mediaHTML(t, span || 1);
  if (t.kind === "rl") return rlHTML(t, span || 1);
  if (t.kind === "mixer") return `<button class="tile mixertile" data-tile="${t.id}" style="--c:${COLORS[t.color] || COLORS.mod}">${ICONS.sliders}<span class="lbl">${esc(t.label || "Mixer")}</span><span class="keys">Volume par appli</span></button>`;
  const on = t.toggle && st.states[t.id];
  return `<button class="tile${on ? " on" : ""}" data-tile="${t.id}" style="--c:${COLORS[t.color] || COLORS.plain};--oc:${COLORS[t.onColor] || COLORS.clip}">
    <span class="flag">${esc(t.onLabel || "Actif")}</span>${ICONS[t.icon] || ICONS.keyboard}<span class="lbl">${esc(t.label)}</span><span class="keys">${esc(describe(t.keys))}</span></button>`;
}
function pageLayout(n, edit) {
  const page = st.pages[n] || st.pages[0];
  const tiles = page.tiles;
  const cols = Math.max(2, Math.min(innerWidth < 640 ? 3 : 8, st.cols));
  // En modification, toujours au moins une case libre après le dernier bouton

/* ---------------- appuis ---------------- */
const grid = $("#grid");
// Le raccourci part dès que le doigt touche le bouton (pas au relâchement) : on gagne le temps d'appui.
// Hors modification : un toucher sans glisser = appui (envoyé au relâchement), un glissé horizontal = page suivante/précédente.
let gest = null, swallowClick = false;
document.addEventListener("pointerdown", e => {
  if (editing || gest || SW.busy || $("#sheetRoot").innerHTML) return;
  if (!e.target.closest("#grid") || !$("#setup").hidden) return;
  if (e.pointerType === "mouse" && e.button !== 0) return;
  const el = e.target.closest("#grid .tile[data-tile]");
  const mk = e.target.closest("[data-mkey]");
  gest = { pid: e.pointerId, x0: e.clientX, y0: e.clientY, t0: performance.now(), el, mk, swipe: false, dead: false, dx: 0, pts: [[performance.now(), e.clientX]] };
  if (mk) mk.classList.add("down"); else if (el) el.classList.add("down");

addEventListener("pointermove", e => {
  const g = gest; if (!g || e.pointerId !== g.pid) return;
  const dx = e.clientX - g.x0, dy = e.clientY - g.y0;
  g.dx = dx; const now = performance.now(); g.pts.push([now, e.clientX]); while (g.pts.length > 2 && now - g.pts[0][0] > 120) g.pts.shift();
  if (!g.swipe && !g.dead) {
    if (Math.abs(dx) > 22 && Math.abs(dx) > Math.abs(dy) * 1.3 && st.pages.length > 1) {
      g.swipe = true; unpress(g); grid.style.transition = "none"; SW.measure();
    } else if (Math.hypot(dx, dy) > 28) { g.dead = true; unpress(g); }
  }
  if (g.swipe) {
    const n = st.page + (dx < 0 ? 1 : -1);
    const has = n >= 0 && n < st.pages.length;
    if (has) ensureGhost(n); else dropGhost();
    setX(has ? dx : dx * 0.25);
  }

function unpress(g) { if (g.el) g.el.classList.remove("down"); if (g.mk) g.mk.classList.remove("down"); }
addEventListener("pointerup", e => {
  const g = gest; if (!g || e.pointerId !== g.pid) return;
  gest = null; unpress(g);
  const dx = e.clientX - g.x0, dt = performance.now() - g.t0;
  if (g.swipe) { endSwipe(g, dx); return; }
  if (g.dead || !g.el) return;
  const t = findTile(g.el.dataset.tile); if (!t) return;
  if (t.kind === "media") { mediaPress(g.mk ? g.mk.dataset.mkey : "media_play_pause", g.mk || g.el); return; }
  if (t.kind === "rl") { swallowClick = true; setTimeout(() => { swallowClick = false; }, 500); openRl(); return; }
  if (t.kind === "mixer") {
    // Au doigt, Android envoie un « clic » juste après le relâchement : il tomberait sur le fond du panneau
    // qui vient de s'ouvrir et le refermerait aussitôt. On l'ignore.
    swallowClick = true; setTimeout(() => { swallowClick = false; }, 500);

  const g = gest; if (!g || e.pointerId !== g.pid) return;

  if (g.swipe) endSwipe(g, g.dx);

function endSwipe(g, dx) {
  swallowClick = true; setTimeout(() => { swallowClick = false; }, 60);

      <li>Touche le <b>crayon</b> en haut : les boutons bougent légèrement, touche-en un pour le modifier (nom, couleur, icône, touche envoyée).</li>
      <li>Pour changer de page, <b>glisse vers la gauche ou la droite</b> n'importe où sur la grille (ou touche le nom de la page en haut).</li>
      <li>Case <b>Musique en cours</b> : en modification, touche une case vide puis choisis <b>Musique en cours</b> (1, 2 ou 3 cases de large). Elle affiche ce qui joue sur le PC (Deezer, Spotify…) avec précédent / lecture / suivant.</li>
      <li><b>Batterie</b> : affichée en haut à droite. Sans toucher la tablette (1 min par défaut, réglable dans Réglages → Veille de l'écran), l'écran passe au minimum avec l'heure ; un toucher le rallume sans appuyer sur un bouton.</li>
      <li><b>Rocket League</b> : touche une case vide (+) en modification et choisis <b>Rocket League</b> (1 à 3 cases). Elle montre ta session (victoires, défaites, série) ; touche-la pour le détail. La session s'affiche aussi sur l'écran de veille. À activer une fois dans Stream Deck PC (carte Rocket League).</li>
      <li><b>Mixer</b> : bouton à curseurs en haut à droite (ou une case Mixer : touche une case vide (+) en modification et choisis <b>Mixer</b>). Elle ouvre le volume général et le volume de chaque appli du PC (Discord, Deezer, jeu…), avec un bouton muet chacune.</li>
      <li>Pour <b>déplacer</b> un bouton, fais-le glisser : sur une case vide il s'y pose, sur un autre bouton ils échangent leur place, sur un onglet il part dans cette page.</li>
      <li>Touche une <b>case vide (+)</b> pour créer un bouton à cet endroit. <b>+ Page</b> crée une page.</li>
      <li><b>Bouton à état</b> : le bouton reste allumé tant que c'est actif (micro coupé, voix activée…).</li>
      <li><b>Tester</b> envoie la touche tout de suite, pratique pour l'assigner dans un logiciel.</li>
      <li>Réglages → <b>Colonnes</b> pour des boutons plus grands ou plus petits.</li></ul></div></details>
    <details><summary>7. Astuces</summary><div class="gbody"><ul>
      <li>Les boutons envoient des touches comme <kbd>Ctrl</kbd> + <kbd>Alt</kbd> + <kbd>F13</kbd> qui n'existent pas sur ton clavier : aucun conflit avec Rocket League, et ça marche en pleine partie.</li>
      <li>Si un bouton affiche « Coupé » alors que ce n'est plus le cas : <b>Modifier</b>, touche le bouton, puis <b>Afficher inactif</b>. L'affichage se corrige sans rien envoyer.</li>
      <li>Les boutons de la page <b>Musique & PC</b> contrôlent Spotify, YouTube ou ton lecteur sans rien régler.</li></ul></div></details>
    <details><summary>Ça ne marche pas ?</summary><div class="gbody"><ul>
      <li><b>Rond orange ou « PC introuvable »</b> : vérifie que StreamDeckPC est ouvert sur le PC et que les deux appareils sont sur le même Wi-Fi. Si l'adresse affichée par le PC a changé, mets-la à jour dans Réglages → PC.</li>
      <li><b>« Code refusé »</b> : retape le code affiché dans la fenêtre du PC.</li>
      <li><b>Le bouton clignote en vert mais rien ne se passe</b> : la touche n'est pas encore assignée dans le logiciel (voir étapes 3 à 5).</li>
      <li><b>Le pare-feu a bloqué le programme</b> : Paramètres Windows → Pare-feu → Autoriser une application → coche StreamDeckPC pour les réseaux privés.</li>
      <li><b>L'antivirus supprime le .exe</b> : c'est fréquent pour un programme non signé qui simule des touches. Ajoute-le aux exceptions si tu lui fais confiance.</li></ul></div></details>
    <div class="foot"><button class="btn" data-act="settings">Réglages</button><button class="btn primary" data-act="close">Fermer</button></div>
  </div></div>`;
}

/* ---------------- événements ---------------- */
document.addEventListener("click", async e => {
  const t = e.target;
  const pg = t.closest("[data-page]");
  if (pg) { const n = +pg.dataset.page; if (!editing && !SW.busy && n !== st.page && Math.abs(n - st.page) === 1) { SW.dx = 0; SW.measure(); slideTo(n); } else { st.page = n; save(); render(); } return; }
  const nat = t.closest("[data-native]"); if (nat) { call(nat.dataset.native); return; }
  if (t.closest("#editBtn")) { editing = !editing; render(); if (editing) toast("Touche un bouton pour le modifier, fais-le glisser pour le déplacer.", 3200); return; }
  if (t.closest("#setBtn")) { openSettings(); return; }
  if (t.closest("#mixBtn")) { openMixer(); return; }
  if (draft && $("#sheetRoot").innerHTML) {
    const c = t.closest("[data-color]"); if (c) { readDraft(); draft.color = c.dataset.color; drawEditor(); return; }
    const tk = t.closest("[data-tkind]");
    if (tk) { readDraft(); const k = tk.dataset.tkind;
      if (k === "media") Object.assign(draft, { kind: "media", label: "Musique", color: "music", w: 2, keys: [], toggle: false });
      else if (k === "rl") { Object.assign(draft, { kind: "rl", label: "Rocket League", color: "music", w: 2, keys: [], toggle: false }); }
      else if (k === "mixer") { delete draft.w; Object.assign(draft, { kind: "mixer", label: "Mixer", color: "mod", icon: "sliders", keys: [], toggle: false }); }
      else { delete draft.kind; delete draft.w; Object.assign(draft, { label: "Nouveau", color: "sound", icon: "star", keys: ["ctrl", "shift", "f21"] }); }
      drawEditor(); return; }
    const sz = t.closest("[data-size]"); if (sz) { draft.w = +sz.dataset.size; drawEditor(); return; }
    const ic = t.closest("[data-icon]"); if (ic) { readDraft(); draft.icon = ic.dataset.icon; drawEditor(); return; }
    const kd = t.closest("[data-kind]"); if (kd) { readDraft(); draft.keys = kd.dataset.kind === "media" ? ["media_play_pause"] : ["ctrl", "shift", "f21"]; drawEditor(); return; }
    const md = t.closest("[data-media]"); if (md) { readDraft(); draft.keys = [md.dataset.media]; drawEditor(); return; }
    const mo = t.closest("[data-mod]"); if (mo) { readDraft(); const m = mo.dataset.mod; const mods = new Set(draft.keys.filter(x => KEYNAME[x])); mods.has(m) ? mods.delete(m) : mods.add(m); const main = draft.keys.find(x => !KEYNAME[x]); draft.keys = ["ctrl", "alt", "shift"].filter(x => mods.has(x)).concat(main); drawEditor(); return; }
  }
  const sl = t.closest("[data-sleep]"); if (sl) { st.sleep = +sl.dataset.sleep; save(); armSleep(); openSettings(); return; }
  const co = t.closest("[data-cols]"); if (co) { st.cols = +co.dataset.cols; save(); renderGrid(); openSettings(); return; }
  const a = t.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  if (act === "scrim" && t !== a) return;
  if (act === "scrim" || act === "close") { $("#sheetRoot").innerHTML = ""; draft = null; return; }
  if (act === "rl-reset") { drawRl(true); return; }
  if (act === "rl-keep") { drawRl(); return; }
  if (act === "rl-reset-yes") { if (C.state === "on" && C.ws) try { C.ws.send(JSON.stringify({ type: "rl_reset" })); } catch (e) {} drawRl(); toast("Session remise à zéro."); return; }
  if (act === "toggle") { readDraft(); draft.toggle = !draft.toggle; drawEditor(); }
  if (act === "flip-state") { readDraft(); st.states[draft.id] = !st.states[draft.id]; save(); renderGrid(); drawEditor(); }
  else if (act === "test") { readDraft(); const r = await sendKeys(draft.keys, draft.label); toast(r.ok ? `Envoyé : ${describe(draft.keys)}` : `Échec : ${r.reason}.`); drawEditor(); }
  else if (act === "save-tile") {
    readDraft(); const isNew = draft.isNew; delete draft.isNew;
    if (isNew) placeTile(pageTiles(), draft, addAt); else { for (const p of st.pages) { const j = p.tiles.findIndex(x => x && x.id === draft.id); if (j >= 0) p.tiles[j] = draft; } }
    if (!draft.toggle) delete st.states[draft.id];
    let room = "";
    if ((draft.kind === "media" || draft.kind === "rl") && draft.w > 1) {
      const tl = pageTiles(), i = tl.findIndex(x => x && x.id === draft.id), cols = Math.max(2, Math.min(innerWidth < 640 ? 3 : 8, st.cols));
      let free = 1; while (free < draft.w && i % cols + free < cols && !tl[i + free]) free++;
      if (i >= 0 && free < draft.w) room = ` Libère ${draft.w - 1 > 1 ? "les " + (draft.w - 1) + " cases" : "la case"} à sa droite (ou déplace-la en début de ligne) pour l'avoir sur ${draft.w} cases.`;
    }
    save(); $("#sheetRoot").innerHTML = ""; draft = null; renderGrid(); toast((isNew ? "Case ajoutée." : "Enregistré.") + room, room ? 5000 : 2400);
  }
  else if (act === "del") { readDraft(); drawEditor(true); }
  else if (act === "keep") drawEditor();
  else if (act === "del-yes") { for (const p of st.pages) p.tiles = p.tiles.map(x => x && x.id === draft.id ? null : x); delete st.states[draft.id]; save(); $("#sheetRoot").innerHTML = ""; draft = null; renderGrid(); toast("Bouton supprimé."); }
  else if (act === "add-page") { st.pages.push({ id: uid(), name: "Page " + (st.pages.length + 1), tiles: [] }); st.page = st.pages.length - 1; save(); render(); }
  else if (act === "rename-page") { $("#sheetRoot").innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet"><h2>Renommer la page</h2><label class="field"><span>Nom</span><input id="pName" maxlength="20" value="${esc(st.pages[st.page].name)}"></label><div class="foot"><button class="btn" data-act="close">Annuler</button><button class="btn primary" data-act="save-page">Enregistrer</button></div></div></div>` }
  else if (act === "save-page") { const v = $("#pName").value.trim(); if (v) st.pages[st.page].name = v; save(); $("#sheetRoot").innerHTML = ""; render(); }
  else if (act === "del-page") { if (st.pages.length > 1) { st.pages.splice(st.page, 1); st.page = 0; save(); $("#sheetRoot").innerHTML = ""; render(); toast("Page supprimée."); } }
  else if (act === "reset-states") { st.states = {}; save(); renderGrid(); toast("Tous les boutons sont éteints."); }
  else if (act === "reset-ask") openSettings(true);
  else if (act === "keep-set") openSettings();
  else if (act === "reset-yes") { st.pages = defaults(); st.page = 0; st.states = {}; save(); $("#sheetRoot").innerHTML = ""; render(); toast("Boutons d'origine remis."); }
  else if (act === "guide") openGuide();
  else if (act === "settings") openSettings();
  else if (act === "setup") { $("#sheetRoot").innerHTML = ""; showSetup(); }
  else if (act === "cancel-setup") showDeck();
  else if (act === "save-pc") {
    const ip = $("#pcIp").value.trim(), code = $("#pcCode").value.trim();
    if (!/^[\w.-]+$/.test(ip)) { $("#setErr").textContent = "Tape l'adresse affichée par le PC, par exemple 192.168.1.23."; return; }
    if (!/^\d{6}$/.test(code)) { $("#setErr").textContent = "Le code fait 6 chiffres."; return; }
    st.pc = ip; st.code = code; save(); C.lastErr = ""; C.retry = 0; $("#setErr").textContent = "Connexion…"; connect();
    setTimeout(() => { if (!$("#setup").hidden && C.state !== "on" && !C.lastErr) $("#setErr").textContent = "Le PC ne répond pas. Vérifie que Stream Deck PC est ouvert et que la tablette est sur le même Wi-Fi."; }, 5000);
  }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "pcCode") document.querySelector('[data-act="save-pc"]').click(); });
window.liseuseBack = () => { if ($("#sheetRoot").innerHTML) { $("#sheetRoot").innerHTML = ""; draft = null; return true; } if (editing) { editing = false; render(); return true; } return true; };
window.liseuseHome = () => { $("#sheetRoot").innerHTML = ""; draft = null; editing = false; if (st.pc) showDeck(); };
// Mise à jour automatique : dès que la nouvelle interface est téléchargée, on l'applique
// au premier moment calme (aucune fenêtre ouverte, pas en modification, 20 s sans appui).
let lastTouch = Date.now(), updatePending = false;
addEventListener("pointerdown", () => { lastTouch = Date.now(); }, true);
function applyUpdateWhenIdle() {
  if (!updatePending) return;
  if (editing || $("#sheetRoot").innerHTML || !$("#setup").hidden || Date.now() - lastTouch < 20000) return void setTimeout(applyUpdateWhenIdle, 5000);
  call("reload");
}
window.liseuseUpdateReady = () => { updatePending = true; toast("Mise à jour téléchargée, elle s'installe toute seule.", 3000); setTimeout(applyUpdateWhenIdle, 5000); };
let rz = 0; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(renderGrid, 100); });

function tick() { const t = new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }); $("#clock").textContent = t; const sc = document.getElementById("sleepClock"); if (sc) sc.textContent = t; }
tick(); setInterval(tick, 15000);

/* ---------------- batterie de la tablette ---------------- */
async function readBattery() {
  let lvl = call("battery"), chg = call("charging");
  if ((lvl == null || lvl < 0) && navigator.getBattery) { try { const b = await navigator.getBattery(); lvl = Math.round(b.level * 100); chg = b.charging; } catch (e) {} }
  if (lvl == null || lvl < 0) return null;
  return { lvl, chg: !!chg };
}
async function paintBattery() {
  const b = await readBattery(); const el = $("#bat"); if (!b) { el.hidden = true; return; }
  el.hidden = false;
  el.className = "bat" + (b.chg ? " chg" : b.lvl <= 15 ? " low" : b.lvl <= 35 ? " mid" : "");
  el.querySelector("i").style.width = Math.max(4, b.lvl) + "%";
  $("#batTxt").textContent = b.lvl + " %";
  el.setAttribute("aria-label", `Batterie ${b.lvl} %${b.chg ? ", en charge" : ""}`);
  const sb = $("#sleepBat"); if (sb) sb.textContent = `${b.chg ? "⚡ " : ""}${b.lvl} %`;
}
paintBattery(); setInterval(paintBattery, 60000);

/* ---------------- veille : écran au minimum quand on ne touche pas ---------------- */
// L'écran est de loin ce qui consomme le plus. En veille : luminosité minimale, écran noir avec l'heure,
// plus d'animations, Wi-Fi rendu à l'économie d'énergie et connexion au PC vérifiée 6× moins souvent.
let asleep = false, sleepT = 0;
function armSleep() {
  clearTimeout(sleepT);
  const s = st.sleep ?? 60;
  if (s > 0 && !asleep) sleepT = setTimeout(goSleep, s * 1000);
}
function goSleep() {
  if (editing || $("#sheetRoot").innerHTML || !$("#setup").hidden || gest || SW.busy) { armSleep(); return; }
  asleep = true;
  document.body.classList.add("asleep");
  let ov = $("#sleep");
  if (!ov) { ov = document.createElement("div"); ov.id = "sleep"; ov.innerHTML = `<div class="sclock" id="sleepClock"></div><div class="sbat" id="sleepBat"></div><div class="srl" id="sleepRl"></div><p>Touche l'écran pour rallumer</p>`; document.body.appendChild(ov); }
  ov.hidden = false; $("#sleepClock").textContent = $("#clock").textContent; paintBattery(); paintRl();
  call("setBrightness", 0.01); call("lowLatency", false); pingEvery(30000);
}
function wake() {
  if (!asleep) { armSleep(); return; }
  asleep = false;
  document.body.classList.remove("asleep");
  const ov = $("#sleep"); if (ov) ov.hidden = true;
  call("setBrightness", -1); call("lowLatency", true); pingEvery(5000); ping(); paintMedia(); paintBattery();
  armSleep();
}
// Le premier toucher pendant la veille ne fait que rallumer : il n'appuie sur rien
addEventListener("pointerdown", e => {            // sur window : passe avant tous les autres gestes
  if (asleep) { e.preventDefault(); e.stopPropagation(); swallowClick = true; setTimeout(() => { swallowClick = false; }, 400); wake(); return; }
  armSleep();
}, true);
window.liseuseWake = () => { if (C.state !== "on" && st.pc) connect(); paintBattery(); wake(); };

/* ---------------- démarrage ---------------- */
call("keepScreenOn", true);
armSleep();
if (st.pc) { showDeck(); connect(); } else { showSetup(); setStatus("off", "Pas de PC"); }
call("ready");
window.__deck = { st, C, sendKeys };
})();
</script>
</body>
</html>
