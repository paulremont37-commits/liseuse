<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f1217">
<title>Stream Deck</title>
<style>
@font-face{font-family:'Bricolage Grotesque';src:url(fonts/bricolage-grotesque-latin-800-normal.woff2) format('woff2');font-weight:800;font-display:swap}
@font-face{font-family:'Inter';src:url(fonts/inter-latin-500-normal.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Inter';src:url(fonts/inter-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'Inter';src:url(fonts/inter-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:swap}
/* Console de jeu : fond ardoise, une couleur par famille de boutons (voix, sons, clip, musique), grille qui remplit l'écran */
:root{
  --bg:#0f1217; --panel:#171b22; --panel-2:#20262f; --line:#2c333e; --fg:#eef1f6; --muted:#8e97a6;
  --voice:#8c9bff; --mod:#4fdc9b; --sound:#ffb23f; --clip:#ff5d6c; --music:#3fd4e0; --plain:#b9c0cc; --pink:#ff7bc8; --lime:#c4f25a;
  --ok:#4fdc9b; --bad:#ff5d6c;
  --f-display:'Bricolage Grotesque','Inter',system-ui,sans-serif;
  --f-ui:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;padding:env(safe-area-inset-top,0px) max(14px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(14px,env(safe-area-inset-left,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sound);outline-offset:2px}
[hidden]{display:none!important}

.shell{height:100%;display:flex;flex-direction:column;gap:12px;padding-block:12px}
.bar{display:flex;align-items:center;gap:10px;min-height:48px}
.status{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:999px;height:44px;padding:0 16px 0 12px;font-weight:600;min-width:0;max-width:40%}
.status span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:12px;height:12px;border-radius:50%;background:var(--muted);flex:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--muted) 20%,transparent)}
.status.on .dot{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 22%,transparent)}
.status.wait .dot{background:var(--sound);animation:blink 1s infinite}
.status.err .dot{background:var(--bad)}
@keyframes blink{50%{opacity:.35}}
.tabs{flex:1;display:flex;justify-content:center;gap:6px;min-width:0;overflow-x:auto;scrollbar-width:none}
.tab{height:44px;border-radius:12px;border:0;background:none;padding:0 18px;font-weight:700;color:var(--muted);white-space:nowrap}
.tab[aria-current="true"]{background:var(--panel-2);color:var(--fg)}
.clock{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;padding:0 6px}
.ib{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;flex:none}
.ib svg{width:22px;height:22px}
.ib[aria-pressed="true"]{background:var(--sound);color:#1b1205;border-color:transparent}

.grid{flex:1;min-height:0;display:grid;gap:14px}
.tile{position:relative;border-radius:24px;border:2px solid color-mix(in srgb,var(--c) 40%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--c) 16%,var(--panel)) 0%,var(--panel) 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px;min-width:0;min-height:0;overflow:hidden;touch-action:manipulation;transition:transform .08s ease,background .15s,border-color .15s}
.tile svg{width:clamp(28px,34%,72px);height:auto;aspect-ratio:1;color:var(--c);flex:none}
.tile .lbl{font-weight:700;font-size:clamp(13px,1.6vw,19px);line-height:1.15;text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.tile .keys{position:absolute;bottom:8px;right:12px;font-size:11px;color:var(--muted);font-weight:600;opacity:0;transition:opacity .15s}
.editing .tile .keys{opacity:1}
.tile.down{transform:scale(.94)}
.tile.on{background:color-mix(in srgb,var(--oc) 30%,var(--panel));border-color:var(--oc)}
.tile.on svg{color:var(--oc)}
.tile .flag{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--oc);color:#12080a;display:none;white-space:nowrap}
.tile.on .flag{display:block}
.tile.ok::after,.tile.fail::after{content:"";position:absolute;inset:0;border-radius:22px;animation:flash .5s ease forwards}
.tile.ok::after{box-shadow:inset 0 0 0 4px var(--ok)}
.tile.fail::after{box-shadow:inset 0 0 0 4px var(--bad)}
@keyframes flash{from{opacity:1}to{opacity:0}}
.tile.add{border-style:dashed;background:none;--c:var(--muted)}
.tile.ghost{visibility:hidden}
.editing .tile:not(.add){animation:wob 1.6s ease-in-out infinite}
.editing .tile:nth-child(2n){animation-delay:-.8s}
@keyframes wob{50%{transform:rotate(.6deg)}}

/* écran de connexion */
.setup{flex:1;display:grid;place-items:center;overflow:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:28px;width:min(680px,100%)}
.card h1{font-family:var(--f-display);font-weight:800;font-size:34px;letter-spacing:-.035em;margin:0 0 8px}
.card p{color:var(--muted);margin:0 0 18px;line-height:1.5}
.steps{margin:0 0 22px;padding-left:22px;color:var(--muted);line-height:1.6}
.steps b{color:var(--fg)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;flex:1 1 200px;min-width:0}
.field span{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field input,.field select{height:56px;border-radius:14px;border:1px solid var(--line);background:var(--panel-2);padding:0 16px;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;min-width:0;width:100%;user-select:text;-webkit-user-select:text}
.err{color:var(--bad);font-weight:600;min-height:22px;margin:12px 0 0}
.btn{height:52px;border-radius:14px;border:1px solid var(--line);background:var(--panel-2);padding:0 20px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.primary{background:var(--sound);color:#1b1205;border-color:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:none}
.btn.danger.solid{background:var(--bad);color:#1a0508}

/* feuilles */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(5,7,10,.7);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:26px;width:min(760px,100%);max-height:100%;overflow:auto;padding:22px}
.sheet h2{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.03em;margin:0 0 14px}
.sheet h3{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:44px;min-width:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);padding:0 14px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid transparent;background:var(--c)}
.sw[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 3px var(--bg) inset}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px}
.icons button{height:56px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);display:grid;place-items:center}
.icons button svg{width:26px;height:26px}
.icons button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:22px}
.foot .left{margin-right:auto}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.toggle-row small{display:block;color:var(--muted)}
.switch{width:56px;height:32px;border-radius:16px;border:0;background:var(--panel-2);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:transform .2s}
.switch[aria-checked="true"]{background:color-mix(in srgb,var(--sound) 45%,var(--panel-2))}
.switch[aria-checked="true"]::after{transform:translateX(24px);background:var(--sound)}
.preview{display:inline-flex;align-items:center;gap:8px;font-weight:700;background:var(--panel-2);border-radius:10px;padding:8px 12px;margin-top:10px;font-variant-numeric:tabular-nums}
.help{background:var(--panel-2);border-radius:16px;padding:14px 16px;color:var(--muted);line-height:1.55}
.help b{color:var(--fg)}
.help ol{margin:6px 0 0;padding-left:20px}
.guide details{border-top:1px solid var(--line)}
.guide details:first-of-type{border-top:0}
.guide summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;font-weight:700;font-size:16px}
.guide summary::-webkit-details-marker{display:none}
.guide summary::after{content:"+";font-size:24px;line-height:1;color:var(--muted);transition:transform .2s}
.guide details[open] summary::after{transform:rotate(45deg)}
.guide .gbody{padding:0 0 18px;color:var(--muted);line-height:1.6}
.guide .gbody b{color:var(--fg)}
.guide ol,.guide ul{margin:6px 0 0;padding-left:22px}
.guide li{margin:4px 0}
.guide kbd{font-family:var(--f-ui);font-size:13px;font-weight:700;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--fg)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--bad) 14%,transparent);border-radius:14px;padding:10px 12px;margin-top:12px}
.confirm span{flex:1 1 200px;font-weight:600}
.toasts{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(520px,calc(100% - 32px))}
.toast{background:#262d38;border-radius:14px;padding:12px 16px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);text-align:center}
@media (max-width:640px){.clock{display:none}.status{max-width:none}.grid{gap:10px}.tile{border-radius:18px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header class="bar">
    <div class="status" id="status"><i class="dot"></i><span id="statusTxt">Hors ligne</span></div>
    <nav class="tabs" id="tabs" aria-label="Pages"></nav>
    <div class="clock" id="clock"></div>
    <button class="ib" id="editBtn" aria-pressed="false" aria-label="Modifier les boutons"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg></button>
    <button class="ib" id="setBtn" aria-label="Réglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
  </header>
  <main class="grid" id="grid"></main>
  <section class="setup" id="setup" hidden></section>
</div>
<div id="sheetRoot"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const AND = window.Android || null;
const call = (fn, ...a) => { try { return AND && AND[fn] ? AND[fn](...a) : null; } catch (e) { return null; } };
const uid = () => Math.random().toString(36).slice(2, 10);
function toast(m, ms = 2400) { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; $("#toasts").appendChild(t); setTimeout(() => t.remove(), ms); }

/* ---------------- icônes (génériques, aucune marque) ---------------- */
const P = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICONS = {
  mic: P('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>'),
  headset: P('<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>'),
  voice: P('<path d="M3 12h2M7 8v8M11 5v14M15 8v8M19 10v4M21 12h0"/>'),
  mask: P('<path d="M4 6c3-1.5 13-1.5 16 0v5c0 5-3.5 9-8 9s-8-4-8-9z"/><path d="M8 11h2M14 11h2M9 15c2 1.5 4 1.5 6 0"/>'),
  clip: P('<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/><circle cx="9.5" cy="12" r="2" fill="currentColor"/>'),
  stop: P('<rect x="6" y="6" width="12" height="12" rx="2"/>'),
  sound: P('<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>'),
  horn: P('<path d="M3 10v4l11 5V5z"/><path d="M14 9h3a3 3 0 0 1 0 6h-3"/><path d="M6 14l1 5h3l-1-4.5"/>'),
  laugh: P('<circle cx="12" cy="12" r="9"/><path d="M8 10h.01M16 10h.01M7.5 14a5 5 0 0 0 9 0z"/>'),
  bolt: P('<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>'),
  star: P('<path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/>'),
  trophy: P('<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 21h8M10 17h4"/>'),
  car: P('<path d="M5 16l1.5-5a2 2 0 0 1 2-1.5h7a2 2 0 0 1 2 1.5L19 16"/><rect x="3" y="16" width="18" height="3" rx="1.5"/><circle cx="7" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/>'),
  ball: P('<circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 5h-5L8 10z"/>'),
  playpause: P('<path d="M5 5v14l8-7z"/><path d="M16 6v12M20 6v12"/>'),
  next: P('<path d="M5 5v14l9-7z"/><path d="M18 5v14"/>'),
  prev: P('<path d="M19 5v14l-9-7z"/><path d="M6 5v14"/>'),
  volup: P('<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9v6M14 12h6"/>'),
  voldown: P('<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M15 12h6"/>'),
  volmute: P('<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9l5 6M21 9l-5 6"/>'),
  music: P('<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>'),
  chat: P('<path d="M4 5h16v11H9l-5 4z"/>'),
  camera: P('<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>'),
  keyboard: P('<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>')
};
const PLUS = P('<path d="M12 5v14M5 12h14"/>');
const COLORS = { voice: "var(--voice)", mod: "var(--mod)", sound: "var(--sound)", clip: "var(--clip)", music: "var(--music)", pink: "var(--pink)", lime: "var(--lime)", plain: "var(--plain)" };
const MEDIA = { media_play_pause: "Lecture / pause", media_next: "Morceau suivant", media_prev: "Morceau précédent", volume_up: "Volume +", volume_down: "Volume −", volume_mute: "Couper le son du PC" };
const KEYNAME = { ctrl: "Ctrl", alt: "Alt", shift: "Maj", win: "Win" };
const describe = k => k.map(x => KEYNAME[x] || MEDIA[x] || x.toUpperCase()).join(" + ");

/* ---------------- boutons par défaut ---------------- */
function defaults() {
  const t = (label, icon, color, keys, extra = {}) => ({ id: uid(), label, icon, color, keys, ...extra });
  const sounds = [["Son 1", "horn"], ["Son 2", "laugh"], ["Son 3", "bolt"], ["Son 4", "star"], ["Son 5", "trophy"], ["Son 6", "car"], ["Son 7", "ball"], ["Son 8", "sound"]];
  return [
    { id: uid(), name: "Jeu", tiles: [
      t("Micro", "mic", "voice", ["ctrl", "alt", "f13"], { toggle: true, onLabel: "Coupé", onColor: "clip" }),
      t("Casque", "headset", "voice", ["ctrl", "alt", "f14"], { toggle: true, onLabel: "Sourdine", onColor: "clip" }),
      t("Voix", "mask", "mod", ["ctrl", "alt", "f15"], { toggle: true, onLabel: "Activée", onColor: "mod" }),
      t("Clip", "clip", "clip", ["ctrl", "alt", "f16"]),
      t("Stop sons", "stop", "sound", ["ctrl", "alt", "f17"]),
      ...sounds.map(([l, i], k) => t(l, i, "sound", ["ctrl", "shift", "f" + (13 + k)])),
      t("Lecture / pause", "playpause", "music", ["media_play_pause"]),
      t("Suivant", "next", "music", ["media_next"])
    ]},
    { id: uid(), name: "Musique & PC", tiles: [
      t("Précédent", "prev", "music", ["media_prev"]),
      t("Lecture / pause", "playpause", "music", ["media_play_pause"]),
      t("Suivant", "next", "music", ["media_next"]),
      t("Volume −", "voldown", "plain", ["volume_down"]),
      t("Volume +", "volup", "plain", ["volume_up"]),
      t("Couper le PC", "volmute", "plain", ["volume_mute"], { toggle: true, onLabel: "Muet", onColor: "clip" })
    ]}
  ];
}

/* ---------------- état ---------------- */
let st = { pc: null, code: "", cols: 5, pages: defaults(), page: 0, states: {}, seenHelp: false };
try { const s = JSON.parse(localStorage.getItem("deck.v1") || "null"); if (s && Array.isArray(s.pages)) st = Object.assign(st, s); } catch (e) {}
const save = () => { try { localStorage.setItem("deck.v1", JSON.stringify(st)); } catch (e) {} };
let editing = false;

/* ---------------- connexion au PC ---------------- */
// Sous Android, la coque gère la connexion (le navigateur intégré bloque ws:// depuis une page sécurisée).
const nativeSocks = {};
window.__deckWs = (id, ev, data) => { const s = nativeSocks[id]; if (!s) return; if (ev === "open") s.onopen && s.onopen(); else if (ev === "message") s.onmessage && s.onmessage({ data }); else { delete nativeSocks[id]; s.onclose && s.onclose({ reason: data }); } };
let sockSeq = 1;
function openSocket(url) {
  if (AND && AND.wsConnect) {
    const id = sockSeq++; const s = { readyState: 0, send: d => call("wsSend", id, d), close: () => { call("wsClose", id); delete nativeSocks[id]; } };
    nativeSocks[id] = s; call("wsConnect", id, url); return s;
  }
  return new WebSocket(url);
}
const C = { ws: null, state: "off", name: "", retry: 0, timer: 0, pending: new Map(), seq: 1, lastErr: "" };
function setStatus(state, txt) {
  C.state = state; const el = $("#status"); el.className = "status " + ({ on: "on", wait: "wait", err: "err" }[state] || "");
  $("#statusTxt").textContent = txt;
}
function connect() {
  clearTimeout(C.timer);
  if (C.ws) { try { C.ws.onclose = null; C.ws.close(); } catch (e) {} C.ws = null; }
  if (!st.pc) { setStatus("off", "Pas de PC"); return; }
  setStatus("wait", "Connexion…");
  let ws; try { ws = openSocket(`ws://${st.pc}:8765`); } catch (e) { return later(); }
  C.ws = ws;
  ws.onopen = () => ws.send(JSON.stringify({ type: "hello", code: st.code }));
  ws.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.type === "ok") { C.retry = 0; C.name = m.name || "PC"; C.lastErr = ""; setStatus("on", C.name + " connecté"); if (!$("#setup").hidden) showDeck(); }
    else if (m.type === "error") { C.lastErr = m.reason || "refusé"; setStatus("err", "Code refusé"); if (!$("#setup").hidden) $("#setErr").textContent = "Le PC a refusé : " + C.lastErr + "."; ws.onclose = null; try { ws.close(); } catch (e) {} C.ws = null; }
    else if (m.type === "result") { const p = C.pending.get(m.id); if (p) { C.pending.delete(m.id); p(m.ok, m.reason); } }
  };
  ws.onclose = () => { C.ws = null; if (C.state === "on") toast("Connexion au PC perdue. Nouvelle tentative…"); later(); };
}
function later() {
  setStatus(C.lastErr ? "err" : "wait", C.lastErr ? "Code refusé" : "PC introuvable");
  if (C.lastErr) return;
  C.retry = Math.min(C.retry + 1, 5); C.timer = setTimeout(connect, [1500, 2000, 3000, 4000, 5000][C.retry - 1]);
}
function sendKeys(keys, label) {
  return new Promise(res => {
    if (C.state !== "on" || !C.ws) return res({ ok: false, reason: "PC non connecté" });
    const id = C.seq++; const t = setTimeout(() => { C.pending.delete(id); res({ ok: false, reason: "pas de réponse du PC" }); }, 2500);
    C.pending.set(id, (ok, reason) => { clearTimeout(t); res({ ok, reason }); });
    C.ws.send(JSON.stringify({ type: "press", id, keys, label }));
  });
}
setInterval(() => { if (C.state === "on" && C.ws) try { C.ws.send(JSON.stringify({ type: "ping" })); } catch (e) {} }, 15000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && C.state !== "on" && st.pc) connect(); });

/* ---------------- rendu ---------------- */
function renderTabs() {
  $("#tabs").innerHTML = st.pages.map((p, i) => `<button class="tab" data-page="${i}" aria-current="${i === st.page}">${esc(p.name)}</button>`).join("") +
    (editing ? `<button class="tab" data-act="add-page">+ Page</button>` : "");
}
function tileHTML(t) {
  const on = t.toggle && st.states[t.id];
  return `<button class="tile${on ? " on" : ""}" data-tile="${t.id}" style="--c:${COLORS[t.color] || COLORS.plain};--oc:${COLORS[t.onColor] || COLORS.clip}">
    <span class="flag">${esc(t.onLabel || "Actif")}</span>${ICONS[t.icon] || ICONS.keyboard}<span class="lbl">${esc(t.label)}</span><span class="keys">${esc(describe(t.keys))}</span></button>`;
}
function renderGrid() {
  const page = st.pages[st.page] || st.pages[0]; if (!page) return;
  const g = $("#grid"); const n = page.tiles.length + (editing ? 1 : 0);
  const cols = Math.max(2, Math.min(innerWidth < 640 ? 3 : 8, st.cols));
  const rows = Math.max(Math.ceil(n / cols), innerWidth < 640 ? 4 : 3);
  g.style.gridTemplateColumns = `repeat(${cols},minmax(0,1fr))`; g.style.gridTemplateRows = `repeat(${rows},minmax(0,1fr))`;
  g.classList.toggle("editing", editing);
  g.innerHTML = page.tiles.map(tileHTML).join("") + (editing ? `<button class="tile add" data-act="add-tile">${PLUS}<span class="lbl">Ajouter</span></button>` : "");
}
function render() { renderTabs(); renderGrid(); $("#editBtn").setAttribute("aria-pressed", String(editing)); }
function showDeck() { $("#setup").hidden = true; $("#grid").hidden = false; render(); }
function showSetup(msg) {
  $("#grid").hidden = true; const s = $("#setup"); s.hidden = false;
  s.innerHTML = `<div class="card">
    <h1>Relier ton PC</h1>
    <p>La tablette envoie les raccourcis à ton PC par le Wi-Fi. Les deux doivent être sur la même box.</p>
    <ol class="steps"><li>Sur le PC, télécharge et lance <b>StreamDeckPC.exe</b> (page Releases du repo liseuse).</li><li>La fenêtre affiche une <b>adresse</b> et un <b>code</b>.</li><li>Tape-les ici.</li></ol>
    <div class="row"><label class="field"><span>Adresse du PC</span><input id="pcIp" inputmode="decimal" placeholder="192.168.1.23" value="${esc(st.pc || "")}" autocomplete="off"></label>
    <label class="field" style="flex:0 1 200px"><span>Code</span><input id="pcCode" inputmode="numeric" maxlength="6" placeholder="000000" value="${esc(st.code || "")}" autocomplete="off"></label></div>
    <p class="err" id="setErr">${esc(msg || "")}</p>
    <div class="foot"><button class="btn" data-act="guide" style="margin-right:auto">Guide</button>${st.pc ? `<button class="btn" data-act="cancel-setup">Annuler</button>` : ""}<button class="btn primary" data-act="save-pc">Connecter</button></div></div>`;
}

/* ---------------- appuis ---------------- */
let pressT = 0, longDone = false;
const grid = $("#grid");
grid.addEventListener("pointerdown", e => {
  const el = e.target.closest(".tile"); if (!el || el.classList.contains("add")) return;
  el.classList.add("down"); longDone = false;
  const t = findTile(el.dataset.tile);
  if (!editing && t && t.toggle) pressT = setTimeout(() => { longDone = true; el.classList.remove("down"); st.states[t.id] = !st.states[t.id]; save(); renderGrid(); toast("État corrigé, rien n'a été envoyé."); }, 700);
});
["pointerup", "pointercancel", "pointerleave"].forEach(ev => grid.addEventListener(ev, e => { clearTimeout(pressT); const el = e.target.closest && e.target.closest(".tile"); if (el) el.classList.remove("down"); }, true));
grid.addEventListener("click", async e => {
  const el = e.target.closest(".tile"); if (!el) return;
  if (el.dataset.act === "add-tile") return openEditor(null);
  const t = findTile(el.dataset.tile); if (!t) return;
  if (editing) return openEditor(t);
  if (longDone) { longDone = false; return; }
  try { navigator.vibrate && navigator.vibrate(12); } catch (x) {}
  const r = await sendKeys(t.keys, t.label);
  const el2 = grid.querySelector(`[data-tile="${t.id}"]`);
  if (r.ok && t.toggle) { st.states[t.id] = !st.states[t.id]; save(); renderGrid(); }
  const cur = grid.querySelector(`[data-tile="${t.id}"]`) || el2;
  if (cur) { cur.classList.remove("ok", "fail"); void cur.offsetWidth; cur.classList.add(r.ok ? "ok" : "fail"); }
  if (!r.ok) toast(r.reason === "PC non connecté" ? "PC non connecté. Vérifie que Stream Deck PC est ouvert." : `Échec : ${r.reason}.`);
});
function findTile(id) { for (const p of st.pages) for (const t of p.tiles) if (t.id === id) return t; return null; }

/* ---------------- éditeur ---------------- */
let draft = null;
const KEYS = [...Array.from({ length: 24 }, (_, i) => "f" + (i + 1)), ..."abcdefghijklmnopqrstuvwxyz0123456789".split("")];
function openEditor(t) {
  draft = t ? JSON.parse(JSON.stringify(t)) : { id: uid(), label: "Nouveau", icon: "star", color: "sound", keys: ["ctrl", "shift", "f21"], toggle: false, onLabel: "Actif", onColor: "clip", isNew: true };
  drawEditor();
}
function drawEditor(confirmDel) {
  const d = draft; const media = d.keys.length === 1 && MEDIA[d.keys[0]];
  const mods = d.keys.filter(k => KEYNAME[k]); const main = d.keys.find(k => !KEYNAME[k]) || "f13";
  $("#sheetRoot").innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">
    <h2>${d.isNew ? "Nouveau bouton" : "Modifier le bouton"}</h2>
    <label class="field"><span>Nom</span><input id="eLabel" maxlength="24" value="${esc(d.label)}"></label>
    <h3>Couleur</h3><div class="chips">${Object.entries(COLORS).map(([k, v]) => `<button class="sw" style="--c:${v}" data-color="${k}" aria-pressed="${d.color === k}" aria-label="${k}"></button>`).join("")}</div>
    <h3>Icône</h3><div class="icons">${Object.entries(ICONS).map(([k, v]) => `<button data-icon="${k}" aria-pressed="${d.icon === k}" aria-label="${k}">${v}</button>`).join("")}</div>
    <h3>Action</h3><div class="chips"><button class="chip" data-kind="hotkey" aria-pressed="${!media}">Raccourci clavier</button><button class="chip" data-kind="media" aria-pressed="${!!media}">Musique et volume</button></div>
    ${media ? `<div class="chips" style="margin-top:10px">${Object.entries(MEDIA).map(([k, v]) => `<button class="chip" data-media="${k}" aria-pressed="${d.keys[0] === k}">${v}</button>`).join("")}</div>`
      : `<div class="row" style="margin-top:10px;align-items:flex-end"><div class="chips">${["ctrl", "alt", "shift"].map(m => `<button class="chip" data-mod="${m}" aria-pressed="${mods.includes(m)}">${KEYNAME[m]}</button>`).join("")}</div>
        <label class="field" style="flex:0 1 160px"><span>Touche</span><select id="eKey">${KEYS.map(k => `<option value="${k}" ${k === main ? "selected" : ""}>${k.toUpperCase()}</option>`).join("")}</select></label></div>`}
    <div class="preview">${esc(describe(d.keys))}</div>
    <div class="toggle-row" style="margin-top:16px"><div>Bouton à état<small>Pour couper/réactiver : le bouton reste allumé tant que c'est actif.</small></div><button class="switch" role="switch" data-act="toggle" aria-checked="${!!d.toggle}" aria-label="Bouton à état"></button></div>
    ${d.toggle ? `<label class="field"><span>Texte quand c'est actif</span><input id="eOn" maxlength="14" value="${esc(d.onLabel || "")}"></label>` : ""}
    ${confirmDel ? `<div class="confirm"><span>Supprimer « ${esc(d.label)} » ?</span><button class="btn" data-act="keep">Garder</button><button class="btn danger solid" data-act="del-yes">Supprimer</button></div>` : ""}
    <div class="foot">${d.isNew ? "" : `<button class="btn danger left" data-act="del">Supprimer</button>`}<button class="btn" data-act="test">Tester</button><button class="btn" data-act="close">Annuler</button><button class="btn primary" data-act="save-tile">Enregistrer</button></div>
  </div></div>`;
}
function readDraft() {
  const l = $("#eLabel"); if (l) draft.label = l.value.trim() || draft.label;
  const o = $("#eOn"); if (o) draft.onLabel = o.value.trim();
  const k = $("#eKey"); if (k) { const mods = draft.keys.filter(x => KEYNAME[x]); draft.keys = [...mods, k.value]; }
}
function pageTiles() { return st.pages[st.page].tiles; }

/* ---------------- réglages ---------------- */
function openSettings(confirmReset) {
  $("#sheetRoot").innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">
    <h2>Réglages</h2>
    <div class="toggle-row" style="border:0"><div>PC<small>${st.pc ? esc(st.pc) + " · " + (C.state === "on" ? "connecté" : "non connecté") : "aucun"}</small></div><button class="btn" data-act="setup">Changer</button></div>
    <div class="toggle-row"><div>Colonnes</div><div class="chips">${[3, 4, 5, 6, 7].map(n => `<button class="chip" data-cols="${n}" aria-pressed="${st.cols === n}">${n}</button>`).join("")}</div></div>
    <div class="toggle-row"><div>Page « ${esc(st.pages[st.page].name)} »<small>Renommer ou supprimer la page affichée.</small></div><div class="chips"><button class="chip" data-act="rename-page">Renommer</button>${st.pages.length > 1 ? `<button class="chip" data-act="del-page">Supprimer</button>` : ""}</div></div>
    <div class="toggle-row"><div>États des boutons<small>Si un bouton affiche « Coupé » alors que ce n'est plus le cas.</small></div><button class="btn" data-act="reset-states">Tout éteindre</button></div>
    <div class="toggle-row"><div>Guide<small>Installation, Discord, Voicemod, Medal, personnalisation, dépannage.</small></div><button class="btn primary" data-act="guide">Ouvrir le guide</button></div>
    ${AND ? `<h3>Tablette</h3><div class="chips"><button class="chip" data-native="openWifi">Wi-Fi</button><button class="chip" data-native="openSettings">Réglages Android</button><button class="chip" data-native="openSamsungHome">Écran d'accueil Samsung</button><button class="chip" data-native="checkUpdate">Mise à jour</button></div>` : ""}
    ${confirmReset ? `<div class="confirm"><span>Remettre tous les boutons d'origine ? Tes modifications seront perdues.</span><button class="btn" data-act="keep-set">Annuler</button><button class="btn danger solid" data-act="reset-yes">Remettre</button></div>` : ""}
    <div class="foot"><button class="btn danger left" data-act="reset-ask">Boutons d'origine</button><button class="btn primary" data-act="close">Fermer</button></div>
  </div></div>`;
}

/* ---------------- guide ---------------- */
function openGuide() {
  $("#sheetRoot").innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet guide" role="dialog" aria-modal="true">
    <h2>Guide</h2>
    <details open><summary>1. Installer le programme sur le PC</summary><div class="gbody"><ol>
      <li>Sur le PC, télécharge <b>StreamDeckPC.exe</b> depuis la page Releases du repo <b>liseuse</b> sur GitHub.</li>
      <li>Lance-le. Si Windows affiche « Windows a protégé votre ordinateur » : <b>Informations complémentaires</b>, puis <b>Exécuter quand même</b>.</li>
      <li>Si le pare-feu demande, autorise les <b>réseaux privés</b>.</li>
      <li>Réponds <b>O</b> à la question du démarrage automatique pour ne plus avoir à le lancer.</li></ol></div></details>
    <details><summary>2. Relier la tablette</summary><div class="gbody"><ol>
      <li>La fenêtre du programme affiche une <b>adresse</b> et un <b>code à 6 chiffres</b>.</li>
      <li>Sur la tablette : Réglages → PC → <b>Changer</b>, tape l'adresse et le code.</li>
      <li>Le rond en haut à gauche passe au vert : c'est connecté.</li></ol>
      La tablette et le PC doivent être sur la même box. La tablette se reconnecte toute seule si le PC redémarre.</div></details>
    <details><summary>3. Brancher Discord</summary><div class="gbody"><ol>
      <li>Dans Discord : Paramètres utilisateur → <b>Raccourcis clavier</b> → ajouter un raccourci.</li>
      <li>Choisis l'action pour couper le micro, clique sur le champ du raccourci, puis appuie sur <b>Micro</b> sur la tablette.</li>
      <li>Ajoute un deuxième raccourci pour la sourdine et appuie sur <b>Casque</b>.</li></ol></div></details>
    <details><summary>4. Brancher Voicemod</summary><div class="gbody"><ul>
      <li><b>Voix</b> : dans les réglages de Voicemod, clique sur le raccourci qui active ou coupe le changement de voix, puis appuie sur <b>Voix</b>.</li>
      <li><b>Soundboard</b> : sur chaque son, clique sur son raccourci puis appuie sur <b>Son 1</b>, <b>Son 2</b>… Renomme ensuite les boutons avec le crayon.</li>
      <li><b>Stop sons</b> : assigne-le au raccourci qui arrête tous les sons.</li></ul>
      Tes potes entendent les sons sur Discord tant que Voicemod est réglé comme micro dans Discord.</div></details>
    <details><summary>5. Brancher Medal</summary><div class="gbody">Dans Medal, ouvre les réglages des clips, clique sur la touche qui enregistre un clip, puis appuie sur <b>Clip</b>. Après un but, un appui suffit pour garder l'action.</div></details>
    <details><summary>6. Personnaliser les boutons</summary><div class="gbody"><ul>
      <li>Touche le <b>crayon</b> en haut : les boutons bougent légèrement, touche-en un pour le modifier (nom, couleur, icône, touche envoyée).</li>
      <li><b>Ajouter</b> crée un nouveau bouton sur la page affichée, <b>+ Page</b> crée une page.</li>
      <li><b>Bouton à état</b> : le bouton reste allumé tant que c'est actif (micro coupé, voix activée…).</li>
      <li><b>Tester</b> envoie la touche tout de suite, pratique pour l'assigner dans un logiciel.</li>
      <li>Réglages → <b>Colonnes</b> pour des boutons plus grands ou plus petits.</li></ul></div></details>
    <details><summary>7. Astuces</summary><div class="gbody"><ul>
      <li>Les boutons envoient des touches comme <kbd>Ctrl</kbd> + <kbd>Alt</kbd> + <kbd>F13</kbd> qui n'existent pas sur ton clavier : aucun conflit avec Rocket League, et ça marche en pleine partie.</li>
      <li>Si un bouton affiche « Coupé » alors que ce n'est plus le cas, fais un <b>appui long</b> dessus : l'affichage se corrige sans rien envoyer.</li>
      <li>Les boutons de la page <b>Musique & PC</b> contrôlent Spotify, YouTube ou ton lecteur sans rien régler.</li></ul></div></details>
    <details><summary>Ça ne marche pas ?</summary><div class="gbody"><ul>
      <li><b>Rond orange ou « PC introuvable »</b> : vérifie que StreamDeckPC est ouvert sur le PC et que les deux appareils sont sur le même Wi-Fi. Si l'adresse affichée par le PC a changé, mets-la à jour dans Réglages → PC.</li>
      <li><b>« Code refusé »</b> : retape le code affiché dans la fenêtre du PC.</li>
      <li><b>Le bouton clignote en vert mais rien ne se passe</b> : la touche n'est pas encore assignée dans le logiciel (voir étapes 3 à 5).</li>
      <li><b>Le pare-feu a bloqué le programme</b> : Paramètres Windows → Pare-feu → Autoriser une application → coche StreamDeckPC pour les réseaux privés.</li>
      <li><b>L'antivirus supprime le .exe</b> : c'est fréquent pour un programme non signé qui simule des touches. Ajoute-le aux exceptions si tu lui fais confiance.</li></ul></div></details>
    <div class="foot"><button class="btn" data-act="settings">Réglages</button><button class="btn primary" data-act="close">Fermer</button></div>
  </div></div>`;
}

/* ---------------- événements ---------------- */
document.addEventListener("click", async e => {
  const t = e.target;
  const pg = t.closest("[data-page]"); if (pg) { st.page = +pg.dataset.page; save(); render(); return; }
  const nat = t.closest("[data-native]"); if (nat) { call(nat.dataset.native); return; }
  if (t.closest("#editBtn")) { editing = !editing; render(); if (editing) toast("Touche un bouton pour le modifier."); return; }
  if (t.closest("#setBtn")) { openSettings(); return; }
  if (draft && $("#sheetRoot").innerHTML) {
    const c = t.closest("[data-color]"); if (c) { readDraft(); draft.color = c.dataset.color; drawEditor(); return; }
    const ic = t.closest("[data-icon]"); if (ic) { readDraft(); draft.icon = ic.dataset.icon; drawEditor(); return; }
    const kd = t.closest("[data-kind]"); if (kd) { readDraft(); draft.keys = kd.dataset.kind === "media" ? ["media_play_pause"] : ["ctrl", "shift", "f21"]; drawEditor(); return; }
    const md = t.closest("[data-media]"); if (md) { readDraft(); draft.keys = [md.dataset.media]; drawEditor(); return; }
    const mo = t.closest("[data-mod]"); if (mo) { readDraft(); const m = mo.dataset.mod; const mods = new Set(draft.keys.filter(x => KEYNAME[x])); mods.has(m) ? mods.delete(m) : mods.add(m); const main = draft.keys.find(x => !KEYNAME[x]); draft.keys = ["ctrl", "alt", "shift"].filter(x => mods.has(x)).concat(main); drawEditor(); return; }
  }
  const co = t.closest("[data-cols]"); if (co) { st.cols = +co.dataset.cols; save(); renderGrid(); openSettings(); return; }
  const a = t.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  if (act === "scrim" && t !== a) return;
  if (act === "scrim" || act === "close") { $("#sheetRoot").innerHTML = ""; draft = null; return; }
  if (act === "toggle") { readDraft(); draft.toggle = !draft.toggle; drawEditor(); }
  else if (act === "test") { readDraft(); const r = await sendKeys(draft.keys, draft.label); toast(r.ok ? `Envoyé : ${describe(draft.keys)}` : `Échec : ${r.reason}.`); drawEditor(); }
  else if (act === "save-tile") {
    readDraft(); const isNew = draft.isNew; delete draft.isNew;
    if (isNew) pageTiles().push(draft); else { const tiles = pageTiles(); const i = tiles.findIndex(x => x.id === draft.id); if (i >= 0) tiles[i] = draft; else for (const p of st.pages) { const j = p.tiles.findIndex(x => x.id === draft.id); if (j >= 0) p.tiles[j] = draft; } }
    if (!draft.toggle) delete st.states[draft.id];
    save(); $("#sheetRoot").innerHTML = ""; draft = null; renderGrid(); toast(isNew ? "Bouton ajouté." : "Bouton enregistré.");
  }
  else if (act === "del") { readDraft(); drawEditor(true); }
  else if (act === "keep") drawEditor();
  else if (act === "del-yes") { for (const p of st.pages) p.tiles = p.tiles.filter(x => x.id !== draft.id); delete st.states[draft.id]; save(); $("#sheetRoot").innerHTML = ""; draft = null; renderGrid(); toast("Bouton supprimé."); }
  else if (act === "add-page") { st.pages.push({ id: uid(), name: "Page " + (st.pages.length + 1), tiles: [] }); st.page = st.pages.length - 1; save(); render(); }
  else if (act === "rename-page") { $("#sheetRoot").innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet"><h2>Renommer la page</h2><label class="field"><span>Nom</span><input id="pName" maxlength="20" value="${esc(st.pages[st.page].name)}"></label><div class="foot"><button class="btn" data-act="close">Annuler</button><button class="btn primary" data-act="save-page">Enregistrer</button></div></div></div>`; $("#pName").focus(); }
  else if (act === "save-page") { const v = $("#pName").value.trim(); if (v) st.pages[st.page].name = v; save(); $("#sheetRoot").innerHTML = ""; render(); }
  else if (act === "del-page") { if (st.pages.length > 1) { st.pages.splice(st.page, 1); st.page = 0; save(); $("#sheetRoot").innerHTML = ""; render(); toast("Page supprimée."); } }
  else if (act === "reset-states") { st.states = {}; save(); renderGrid(); toast("Tous les boutons sont éteints."); }
  else if (act === "reset-ask") openSettings(true);
  else if (act === "keep-set") openSettings();
  else if (act === "reset-yes") { st.pages = defaults(); st.page = 0; st.states = {}; save(); $("#sheetRoot").innerHTML = ""; render(); toast("Boutons d'origine remis."); }
  else if (act === "guide") openGuide();
  else if (act === "settings") openSettings();
  else if (act === "setup") { $("#sheetRoot").innerHTML = ""; showSetup(); }
  else if (act === "cancel-setup") showDeck();
  else if (act === "save-pc") {
    const ip = $("#pcIp").value.trim(), code = $("#pcCode").value.trim();
    if (!/^[\w.-]+$/.test(ip)) { $("#setErr").textContent = "Tape l'adresse affichée par le PC, par exemple 192.168.1.23."; return; }
    if (!/^\d{6}$/.test(code)) { $("#setErr").textContent = "Le code fait 6 chiffres."; return; }
    st.pc = ip; st.code = code; save(); C.lastErr = ""; C.retry = 0; $("#setErr").textContent = "Connexion…"; connect();
    setTimeout(() => { if (!$("#setup").hidden && C.state !== "on" && !C.lastErr) $("#setErr").textContent = "Le PC ne répond pas. Vérifie que Stream Deck PC est ouvert et que la tablette est sur le même Wi-Fi."; }, 5000);
  }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "pcCode") document.querySelector('[data-act="save-pc"]').click(); });
window.liseuseBack = () => { if ($("#sheetRoot").innerHTML) { $("#sheetRoot").innerHTML = ""; draft = null; return true; } if (editing) { editing = false; render(); return true; } return true; };
window.liseuseHome = () => { $("#sheetRoot").innerHTML = ""; draft = null; editing = false; if (st.pc) showDeck(); };
window.liseuseUpdateReady = () => toast("Nouvelle version téléchargée. Elle s'applique au prochain démarrage.", 4000);
let rz = 0; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(renderGrid, 100); });

function tick() { $("#clock").textContent = new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }); }
tick(); setInterval(tick, 15000);

/* ---------------- démarrage ---------------- */
call("keepScreenOn", true);
if (st.pc) { showDeck(); connect(); } else { showSetup(); setStatus("off", "Pas de PC"); }
call("ready");
window.__deck = { st, C, sendKeys };
})();
</script>
</body>
</html>
