plugins {
    id 'com.android.application'
}

// Numéro de version = numéro du build GitHub (1 en local)
def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
def ksPass = System.getenv("KS_PASS") ?: "liseuse-tab"
def pages = "https://paulremont37-commits.github.io/liseuse/"

android {
    namespace 'fr.paulremont.liseuse'
    compileSdk 34

    defaultConfig {
        applicationId "fr.paulremont.liseuse"
        minSdk 24
        targetSdk 34
        versionCode runNumber
        versionName "1.0." + runNumber
    }

    buildFeatures {
        buildConfig true
    }

    // Deux applis avec la même coque : la liseuse et le Stream Deck
    flavorDimensions = ["app"]
    productFlavors {
        liseuse {
            dimension "app"
            applicationId "fr.paulremont.liseuse"
            resValue "string", "app_name", "Liseuse"
            buildConfigField "String", "WEB_REMOTE", "\"${pages}\""
            manifestPlaceholders = [cleartext: "false"]
        }
        losc {
            dimension "app"
            applicationId "fr.paulremont.dogues"
            resValue "string", "app_name", "Dogues"
            buildConfigField "String", "WEB_REMOTE", "\"${pages}losc/\""
            manifestPlaceholders = [cleartext: "false"]
        }
        deck {
            dimension "app"
            applicationId "fr.paulremont.deck"
            resValue "string", "app_name", "Stream Deck"
            buildConfigField "String", "WEB_REMOTE", "\"${pages}deck/\""
            // Le Stream Deck parle au PC en Wi-Fi local, sans chiffrement (ws://)
            manifestPlaceholders = [cleartext: "true"]
        }
    }

    signingConfigs {
        release {
            storeFile file("../liseuse.keystore")
            storePassword ksPass
            keyAlias "liseuse"
            keyPassword ksPass
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // L'interface est embarquée dans l'APK pour marcher hors ligne dès le premier lancement.
    sourceSets {
        liseuse {
            assets.srcDirs += ["$rootDir/build/assets-liseuse"]
        }
        deck {
            assets.srcDirs += ["$rootDir/build/assets-deck"]
        }
        losc {
            assets.srcDirs += ["$rootDir/build/assets-losc"]
        }
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    loscImplementation 'androidx.work:work-runtime:2.9.1'
}

tasks.register('copyWebLiseuse', Copy) {
    from "$rootDir/../web"
    into "$rootDir/build/assets-liseuse/web"
}
tasks.register('copyWebDeck', Copy) {
    from "$rootDir/../deck"
    into "$rootDir/build/assets-deck/web"
}
tasks.register('copyWebLosc', Copy) {
    from "$rootDir/../losc"
    into "$rootDir/build/assets-losc/web"
}
tasks.named('preBuild') { dependsOn 'copyWebLiseuse', 'copyWebDeck', 'copyWebLosc' }
