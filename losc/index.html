<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1630">
<title>Dogues</title>
<style>
@font-face{font-family:'Barlow Condensed';src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'Barlow Condensed';src:url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Barlow Condensed';src:url(fonts/barlow-condensed-latin-800-normal.woff2) format('woff2');font-weight:800;font-display:swap}
@font-face{font-family:'Inter';src:url(fonts/inter-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Inter';src:url(fonts/inter-latin-500-normal.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Inter';src:url(fonts/inter-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'Inter';src:url(fonts/inter-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:swap}
/* Tribune de nuit : bleu marine profond, rouge vif pour ce qui compte (direct, Lille, actions), blanc pour le texte.
   Tablette : le prochain match en colonne fixe à gauche, le reste en onglets à droite. Téléphone : tout empilé. */
:root{
  --navy:#0a1630; --navy-2:#101f3f; --navy-3:#172a52; --line:#223764; --white:#f4f6fb; --muted:#9aa8c7; --faint:#6f7fa3;
  --red:#e2001a; --red-soft:#ff4458; --win:#2fc47b; --draw:#e5b53a; --lose:#ff4458;
  --f-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-ui:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--navy);color:var(--white);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--red-soft);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

.app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:12px max(18px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--navy)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.02em;line-height:1;text-transform:uppercase}
.brand b i{font-style:normal;color:var(--red)}
.brand small{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
.fresh{margin-left:auto;font-size:12.5px;color:var(--muted);text-align:right;line-height:1.3;min-width:0}
.fresh b{color:var(--white);font-weight:600}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--navy-2);display:grid;place-items:center;flex:none}
.ib svg{width:20px;height:20px}
.ib.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(340px,42%) minmax(0,1fr)}
.hero > *{flex-shrink:0}
.hero{overflow-y:auto;border-right:1px solid var(--line);padding:20px max(18px,env(safe-area-inset-left,0px)) 40px 18px;display:flex;flex-direction:column;gap:16px}
.side{min-width:0;display:flex;flex-direction:column}
.tabs{display:flex;gap:4px;padding:12px max(18px,env(safe-area-inset-right,0px)) 0 18px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:10px 14px 12px;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--white);border-bottom-color:var(--red)}
.panel{flex:1;overflow-y:auto;padding:16px max(18px,env(safe-area-inset-right,0px)) 40px 18px}
@media (max-width:860px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .body{display:block}
  .hero{border-right:0;overflow:visible;padding:16px max(16px,env(safe-area-inset-left,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
  .tabs{position:sticky;top:0;z-index:4;background:var(--navy);overflow-x:auto;scrollbar-width:none;padding-left:max(16px,env(safe-area-inset-left,0px))}
  .panel{overflow:visible;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .brand small{display:none}
  .tab{font-size:17px;padding:10px 10px 12px}
}

/* ----- carte du match ----- */
.match{position:relative;border-radius:22px;background:linear-gradient(160deg,var(--navy-3),var(--navy-2) 60%);border:1px solid var(--line);padding:20px;overflow:hidden}
.match::before{content:"";position:absolute;right:-60px;top:-40px;width:220px;height:120%;background:var(--red);opacity:.09;transform:skewX(-18deg);pointer-events:none}
.kick{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kick .sep{opacity:.4}
.when{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.01em;margin:6px 0 16px;text-transform:capitalize}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.team{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.team span{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.05;text-transform:uppercase;overflow-wrap:anywhere}
.badge{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.02em;background:var(--navy);border:2px solid var(--line);color:var(--muted)}
.badge.us{background:var(--red);border-color:var(--red);color:#fff}
.badge.sm{width:30px;height:30px;border-radius:9px;font-size:12px;border-width:1.5px}
.mid{text-align:center}
.score{font-family:var(--f-display);font-weight:800;font-size:68px;line-height:.9;letter-spacing:.02em;white-space:nowrap}
.vs{font-family:var(--f-display);font-weight:700;font-size:26px;color:var(--faint)}
.count{display:flex;gap:6px;justify-content:center;margin-top:18px}
.count div{background:var(--navy);border:1px solid var(--line);border-radius:12px;padding:6px 10px;text-align:center;min-width:58px}
.count b{display:block;font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1}
.count small{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.venue{margin-top:14px;text-align:center;color:var(--muted);font-size:13px}
.live{display:inline-flex;align-items:center;gap:7px;background:var(--red);color:#fff;border-radius:99px;padding:3px 10px 3px 8px;font-weight:800;letter-spacing:.08em}
.live i{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.min{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--red-soft);margin-top:4px}

.block{border-radius:18px;background:var(--navy-2);border:1px solid var(--line);padding:16px}
.block h3{margin:0 0 10px;font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.block h3 small{font-family:var(--f-ui);font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--faint);margin-left:auto}
.empty{color:var(--muted);font-size:14px}
.abs{display:flex;flex-direction:column;gap:8px}
.abs div{display:flex;align-items:center;gap:10px}
.abs b{font-weight:600}
.abs small{color:var(--muted);margin-left:auto;text-align:right}
.pill{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;flex:none}
.pill.out{background:color-mix(in srgb,var(--lose) 22%,transparent);color:var(--red-soft)}
.pill.doubt{background:color-mix(in srgb,var(--draw) 20%,transparent);color:var(--draw)}
.xi{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
.xi div{display:flex;gap:10px;align-items:baseline;min-width:0}
.xi b{font-family:var(--f-display);font-weight:800;color:var(--red-soft);min-width:22px;text-align:right}
.xi span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.events{display:flex;flex-direction:column;gap:2px}
.ev{display:grid;grid-template-columns:44px 22px minmax(0,1fr);gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .t{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--muted);text-align:right}
.ev .ic{width:18px;height:18px;border-radius:4px}
.ev .ic.goal{border-radius:50%;background:var(--white)}
.ev .ic.yc{background:var(--draw);width:13px;height:18px}
.ev .ic.rc{background:var(--lose);width:13px;height:18px}
.ev .ic.sub{background:none;border:2px solid var(--muted);border-radius:50%;width:14px;height:14px}
.ev .ic.var{background:none;border:2px solid var(--muted)}
.ev .who{min-width:0}
.ev .who b{font-weight:600}
.ev .who small{display:block;color:var(--muted);font-size:12.5px}
.ev.us .who b{color:var(--white)}
.ev.them{opacity:.75}

.banner{border-radius:16px;padding:14px 16px;background:color-mix(in srgb,var(--red) 16%,var(--navy-2));border:1px solid color-mix(in srgb,var(--red) 50%,transparent);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{margin:0;flex:1 1 220px}
.banner b{display:block}
.btn{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--navy-3);padding:0 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.primary{background:var(--red);border-color:transparent;color:#fff}
.result{display:flex;align-items:center;gap:12px}
.result .res{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px;color:#0a1630;flex:none}
.res.w{background:var(--win)}.res.d{background:var(--draw)}.res.l{background:var(--lose)}
.result .info{min-width:0;flex:1}
.result .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result .info small{color:var(--muted)}
.result .sc{font-family:var(--f-display);font-weight:800;font-size:26px;white-space:nowrap}

/* ----- actus ----- */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{height:34px;border-radius:99px;border:1px solid var(--line);background:var(--navy-2);padding:0 14px;font-weight:600;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--white);color:var(--navy);border-color:transparent}
.news{display:flex;flex-direction:column}
.item{display:block;padding:14px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .meta{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:4px;flex-wrap:wrap}
.item .meta b{color:var(--white);font-weight:600}
.item .title{font-size:16.5px;font-weight:600;line-height:1.35;text-wrap:pretty}
.item.fresh-item .title::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:8px;vertical-align:middle;transform:translateY(-1px)}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--navy-3);color:var(--white)}
.tag.Mercato{background:#2b5cff33;color:#8fb0ff}
.tag.Infirmerie{background:color-mix(in srgb,var(--lose) 22%,transparent);color:var(--red-soft)}
.tag.Suspension{background:color-mix(in srgb,var(--draw) 20%,transparent);color:var(--draw)}
.tag.Officiel{background:color-mix(in srgb,var(--win) 20%,transparent);color:var(--win)}

/* ----- matchs ----- */
.h{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:18px 0 8px}
.h:first-child{margin-top:4px}
.fx{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.fx:first-of-type{border-top:0}
.fx .d{font-size:12.5px;color:var(--muted);line-height:1.3}
.fx .d b{display:block;color:var(--white);font-family:var(--f-display);font-size:18px;font-weight:700;text-transform:capitalize}
.fx .vs2{min-width:0}
.fx .vs2 b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.fx .vs2 small{color:var(--muted);font-size:12.5px}
.fx .r{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:22px}
.fx .r .res{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:15px;color:#0a1630}
.fx.next{background:color-mix(in srgb,var(--red) 10%,transparent);border-radius:12px;padding-inline:10px;border-top-color:transparent}

/* ----- classement ----- */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:right;padding:6px 6px 8px}
th:nth-child(2){text-align:left}
td{padding:8px 6px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
td:nth-child(1){color:var(--muted);width:30px;position:relative}
td:nth-child(2){text-align:left;font-weight:600;max-width:180px;overflow:hidden;text-overflow:ellipsis}
td.pts{font-family:var(--f-display);font-weight:800;font-size:18px}
tr.us td{background:color-mix(in srgb,var(--red) 18%,transparent)}
tr.us td:nth-child(2){color:#fff}
td .zone{position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px}
.form{display:inline-flex;gap:3px}
.form i{width:14px;height:14px;border-radius:4px;display:inline-grid;place-items:center;font-style:normal;font-size:9px;font-weight:800;color:#0a1630}
.form .W{background:var(--win)}.form .D{background:var(--draw)}.form .L{background:var(--lose)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
@media (max-width:520px){.hide-sm{display:none}}

/* ----- effectif ----- */
.squad{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:2px 20px}
.pl{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.pl .n{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--red-soft);width:30px;text-align:right;flex:none}
.pl .nm{min-width:0;flex:1}
.pl .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .nm small{color:var(--muted);font-size:12.5px}

/* ----- feuille réglages ----- */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(3,8,20,.7);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--navy-2);border:1px solid var(--line);border-radius:24px;width:min(640px,100%);max-height:100%;overflow:auto;padding:22px}
.sheet h2{font-family:var(--f-display);font-weight:800;font-size:30px;text-transform:uppercase;letter-spacing:.02em;margin:0 0 4px}
.sheet h4{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:20px 0 8px}
.sheet p{color:var(--muted);margin:0 0 10px}
.field{display:flex;gap:8px;flex-wrap:wrap}
.field input{flex:1 1 240px;min-width:0;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--navy);padding:0 14px;font-size:16px;font-family:ui-monospace,Menlo,monospace}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.row small{display:block;color:var(--muted)}
.switch{width:52px;height:30px;border-radius:15px;border:0;background:var(--navy-3);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--faint);transition:transform .2s}
.switch[aria-checked="true"]{background:color-mix(in srgb,var(--red) 55%,var(--navy-3))}
.switch[aria-checked="true"]::after{transform:translateX(22px);background:#fff}
.steps{margin:0;padding-left:20px;color:var(--muted);line-height:1.6}
.steps b{color:var(--white)}
.foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.note{font-size:12.5px;color:var(--faint);margin-top:16px}
.toasts{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(480px,calc(100% - 32px))}
.toast{background:#1d3260;border-radius:12px;padding:11px 16px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><b>Dogues<i>.</i></b><small>Appli de fan · non officielle</small></div>
    <div class="fresh" id="fresh"></div>
    <button class="ib" id="refresh" aria-label="Actualiser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
    <button class="ib" id="settingsBtn" aria-label="Réglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </header>
  <div class="body">
    <section class="hero" id="hero" aria-label="Prochain match"></section>
    <section class="side">
      <nav class="tabs" role="tablist" id="tabs"></nav>
      <div class="panel" id="panel"></div>
    </section>
  </div>
</div>
<div id="sheetRoot"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const NATIVE = window.Losc || null;
const call = (fn, ...a) => { try { return window.Android && window.Android[fn] ? window.Android[fn](...a) : null; } catch (e) { return null; } };
function toast(m, ms = 2600) { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; $("#toasts").appendChild(t); setTimeout(() => t.remove(), ms); }

const LIVE = new Set(["1H", "HT", "2H", "ET", "BT", "P", "LIVE", "INT", "SUSP"]);
const DONE = new Set(["FT", "AET", "PEN", "AWD", "WO"]);
const STATUS = { NS: "À venir", TBD: "Horaire à confirmer", "1H": "1re mi-temps", HT: "Mi-temps", "2H": "2e mi-temps", ET: "Prolongation", BT: "Pause", P: "Tirs au but", LIVE: "En cours", INT: "Interrompu", SUSP: "Suspendu", FT: "Terminé", AET: "Après prolongation", PEN: "Après tirs au but", PST: "Reporté", CANC: "Annulé", ABD: "Abandonné", AWD: "Sur tapis vert", WO: "Forfait" };
const LEAGUES = { "UEFA Champions League": "Ligue des champions", "UEFA Europa League": "Ligue Europa", "UEFA Europa Conference League": "Ligue Conférence", "UEFA Conference League": "Ligue Conférence", "Club Friendlies": "Match amical", "Friendlies Clubs": "Match amical", "Trophée des Champions": "Trophée des champions" };
const POS = { Goalkeeper: "Gardiens", Defender: "Défenseurs", Midfielder: "Milieux", Attacker: "Attaquants" };
const REASONS = [[/suspend/i, "Suspendu"], [/red card/i, "Carton rouge"], [/yellow card/i, "Cumul de cartons"], [/knee/i, "Genou"], [/hamstring/i, "Ischio-jambiers"], [/ankle/i, "Cheville"], [/thigh/i, "Cuisse"], [/calf/i, "Mollet"], [/groin/i, "Adducteurs"], [/achilles/i, "Tendon d'Achille"], [/foot/i, "Pied"], [/back/i, "Dos"], [/shoulder/i, "Épaule"], [/head|concussion/i, "Commotion"], [/muscle/i, "Blessure musculaire"], [/illness|virus|sick/i, "Malade"], [/knock/i, "Coup"], [/international/i, "Sélection nationale"], [/injury/i, "Blessure"], [/inactive/i, "Indisponible"]];
const reasonFr = r => { for (const [re, fr] of REASONS) if (re.test(r || "")) return fr; return r || "Indisponible"; };
const leagueFr = n => LEAGUES[n] || n || "";
function roundFr(r) {
  if (!r) return "";
  let m = r.match(/Regular Season\s*-\s*(\d+)/i); if (m) return `${m[1]}e journée`;
  m = r.match(/League Stage\s*-\s*(\d+)/i); if (m) return `Phase de ligue · J${m[1]}`;
  const map = { "Round of 64": "32es de finale", "Round of 32": "16es de finale", "Round of 16": "8es de finale", "Quarter-finals": "Quarts de finale", "Semi-finals": "Demi-finales", "Final": "Finale" };
  return map[r] || r;
}
const TZ = "Europe/Paris";
const fmt = (ts, o) => new Date(ts * 1000).toLocaleString("fr-FR", { timeZone: TZ, ...o });
const dayLong = ts => fmt(ts, { weekday: "long", day: "numeric", month: "long" });
const hour = ts => fmt(ts, { hour: "2-digit", minute: "2-digit" });
function ago(ms) {
  const s = Math.max(0, (Date.now() - ms) / 1000);
  if (s < 60) return "à l'instant"; if (s < 3600) return `il y a ${Math.floor(s / 60)} min`;
  if (s < 86400) return `il y a ${Math.floor(s / 3600)} h`; const d = Math.floor(s / 86400); return d === 1 ? "hier" : `il y a ${d} j`;
}
const initials = n => (n || "?").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z ]/g, "").replace(/^(FC|AS|OGC|RC|SC|AJ|Stade|Olympique|Paris)\s+/i, "").slice(0, 3).toUpperCase() || "?";

/* ---------------- données ---------------- */
let D = {}, P = {}, tab = "news", newsFilter = "all", refreshing = false, lastSeenNews = 0;
try { tab = localStorage.getItem("dogues.tab") || "news"; lastSeenNews = +(localStorage.getItem("dogues.seen") || 0); } catch (e) {}
function load() {
  if (NATIVE) {
    try { D = JSON.parse(NATIVE.data() || "{}"); } catch (e) { D = {}; }
    try { P = JSON.parse(NATIVE.settings() || "{}"); } catch (e) { P = {}; }
  } else { D = demo(); P = { hasKey: true, keyHint: "••••demo", notifGoals: true, notifLineup: true, notifNews: true, notifAllowed: true, budget: { used: 18, remaining: 82 } }; }
}
const TEAM = () => D.team || 0;
const isUs = t => t && t.id === TEAM();
function fixtures() {
  const list = (D.fixtures || []).map(f => ({ ...f }));
  const m = D.match;
  if (m) { const i = list.findIndex(f => f.id === m.id); if (i >= 0) list[i] = { ...list[i], ...m }; }
  return list;
}
function nextFx(list) {
  const now = Date.now();
  return list.find(f => LIVE.has(f.status)) || list.find(f => (f.status === "NS" || f.status === "TBD") && f.ts * 1000 > now - 3 * 3600e3) || null;
}
function lastFx(list) { const done = list.filter(f => DONE.has(f.status)); return done[done.length - 1] || null; }
function outcome(f) {
  if (f.gh < 0 || f.ga < 0) return null;
  const us = isUs(f.home) ? f.gh : f.ga, them = isUs(f.home) ? f.ga : f.gh;
  return us > them ? "w" : us < them ? "l" : "d";
}
const OUT = { w: "V", d: "N", l: "D" };

/* ---------------- en-tête ---------------- */
function renderFresh() {
  const el = $("#fresh");
  if (!D.updatedAt) { el.innerHTML = NATIVE ? "Première mise à jour…" : "<b>Données d'exemple</b><br>aperçu hors appli"; return; }
  const next = D.nextAt ? `prochaine vers ${new Date(D.nextAt).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}` : "";
  el.innerHTML = `Mis à jour <b>${ago(D.updatedAt)}</b>${next ? `<br>${next}` : ""}`;
}

/* ---------------- héros : prochain match ---------------- */
function teamCol(t) { return `<div class="team"><div class="badge${isUs(t) ? " us" : ""}">${esc(initials(t && t.name))}</div><span>${esc(t ? t.name : "")}</span></div>`; }
function countdown(ts) {
  let s = Math.max(0, Math.floor(ts - Date.now() / 1000));
  const d = Math.floor(s / 86400); s -= d * 86400; const h = Math.floor(s / 3600); s -= h * 3600; const m = Math.floor(s / 60); s -= m * 60;
  const cell = (v, l) => `<div><b class="num">${String(v).padStart(2, "0")}</b><small>${l}</small></div>`;
  return `<div class="count" id="count" data-ts="${ts}">${cell(d, "jours")}${cell(h, "h")}${cell(m, "min")}${cell(s, "s")}</div>`;
}
function eventsHTML(m) {
  const ev = (m.events || []).slice().sort((a, b) => (b.min * 100 + b.extra) - (a.min * 100 + a.extra));
  if (!ev.length) return "";
  const row = e => {
    let ic = "var", what = e.detail || e.type;
    if (e.type === "Goal") { ic = e.detail === "Missed Penalty" ? "var" : "goal"; what = e.detail === "Own Goal" ? "But contre son camp" : e.detail === "Penalty" ? "But sur penalty" : e.detail === "Missed Penalty" ? "Penalty manqué" : "But"; }
    else if (e.type === "Card") { ic = /red/i.test(e.detail) ? "rc" : "yc"; what = /red/i.test(e.detail) ? "Carton rouge" : "Carton jaune"; }
    else if (e.type === "subst") { ic = "sub"; what = e.assist ? `Remplace ${e.assist}` : "Remplacement"; }
    else if (e.type === "Var") { what = "Arbitrage vidéo" + (e.detail ? ` · ${e.detail}` : ""); }
    const extra = e.type === "Goal" && e.assist && e.detail !== "Missed Penalty" ? ` · passe de ${e.assist}` : "";
    const ours = e.team === TEAM();
    return `<div class="ev ${ours ? "us" : "them"}"><span class="t num">${e.min}${e.extra ? "+" + e.extra : ""}'</span><i class="ic ${ic}"></i><div class="who"><b>${esc(e.type === "subst" ? e.player : e.player || what)}</b><small>${esc(what + extra)}</small></div></div>`;
  };
  return `<div class="block"><h3>Le match<small>${esc(ev.length)} actions</small></h3><div class="events">${ev.map(row).join("")}</div></div>`;
}
function lineupHTML(m, live) {
  const lu = (m.lineups || []).find(l => l.team === TEAM());
  if (!lu) return live ? "" : `<div class="block"><h3>Compo</h3><p class="empty">La compo officielle tombe environ une heure avant le coup d'envoi. ${P.notifLineup ? "Tu recevras une notification." : ""}</p></div>`;
  return `<div class="block"><h3>Compo${lu.formation ? ` · ${esc(lu.formation)}` : ""}<small>${lu.coach ? "Coach : " + esc(lu.coach) : ""}</small></h3>
    <div class="xi">${(lu.xi || []).map(p => `<div><b class="num">${p.n || ""}</b><span>${esc(p.name)}</span></div>`).join("")}</div>
    ${lu.subs && lu.subs.length ? `<p class="empty" style="margin:10px 0 0">Remplaçants : ${lu.subs.map(p => esc(p.name)).join(", ")}</p>` : ""}</div>`;
}
function absentsHTML(f) {
  const list = (D.injuries || []).filter(i => i.team === TEAM() && D.injFixture === f.id);
  const known = D.injFixture === f.id;
  return `<div class="block"><h3>Absents${known && D.injAt ? `<small>vérifié ${ago(D.injAt)}</small>` : ""}</h3>${
    !known ? `<p class="empty">Pas encore d'infos pour ce match.</p>` :
    !list.length ? `<p class="empty">Aucun absent signalé pour l'instant.</p>` :
    `<div class="abs">${list.map(i => `<div><span class="pill ${/questionable/i.test(i.type) ? "doubt" : "out"}">${/questionable/i.test(i.type) ? "Incertain" : "Absent"}</span><b>${esc(i.name)}</b><small>${esc(reasonFr(i.reason))}</small></div>`).join("")}</div>`}</div>`;
}
function renderHero() {
  const h = $("#hero"); const list = fixtures(); const f = nextFx(list); const last = lastFx(list);
  const err = D.errors && D.errors.api;
  let html = "";
  if (NATIVE && (!P.hasKey || err === "nokey")) html += `<div class="banner"><p><b>Ajoute ta clé API-Football</b>Sans elle : pas de matchs, de compos ni d'absents. Les actus marchent déjà.</p><button class="btn primary" data-act="settings">Ajouter</button></div>`;
  else if (err) html += `<div class="banner"><p><b>Infos matchs indisponibles</b>${esc(err)}</p><button class="btn" data-act="settings">Réglages</button></div>`;
  if (f) {
    const live = LIVE.has(f.status), hasScore = f.gh >= 0 && f.ga >= 0;
    const meta = [leagueFr(f.league), roundFr(f.round)].filter(Boolean).map(esc).join('<span class="sep">·</span>');
    html += `<article class="match">
      <div class="kick">${live ? `<span class="live"><i></i>En direct</span>` : ""}${meta}</div>
      <div class="when"${live ? ' style="text-transform:none"' : ""}>${live ? esc(STATUS[f.status] || "") : `${esc(dayLong(f.ts))} · ${esc(hour(f.ts))}`}</div>
      <div class="teams">${teamCol(f.home)}<div class="mid">${live || hasScore && f.status !== "NS" ? `<div class="score num">${f.gh} – ${f.ga}</div>${live && f.elapsed > 0 && f.status !== "HT" ? `<div class="min num">${f.elapsed}'</div>` : ""}` : `<div class="vs">VS</div>`}</div>${teamCol(f.away)}</div>
      ${live ? "" : f.ts * 1000 > Date.now() ? countdown(f.ts) : `<div class="venue">Coup d'envoi imminent</div>`}
      ${f.venue ? `<div class="venue">${esc(f.venue)}${f.city ? " · " + esc(f.city) : ""}</div>` : ""}
    </article>`;
    if (live) html += eventsHTML(f);
    html += lineupHTML(f, live);
    if (!live) html += absentsHTML(f);
  } else if (D.fixtures && D.fixtures.length) {
    html += `<div class="block"><h3>Prochain match</h3><p class="empty">Aucun match programmé pour l'instant.</p></div>`;
  } else if (!html) {
    html += `<div class="block"><h3>Prochain match</h3><p class="empty">Chargement des matchs…</p></div>`;
  }
  if (last && (!f || last.id !== f.id)) {
    const o = outcome(last);
    html += `<div class="block"><h3>Dernier match<small>${esc(dayLong(last.ts))}</small></h3><div class="result">${o ? `<span class="res ${o}">${OUT[o]}</span>` : ""}<div class="info"><b>${esc(last.home.name)} – ${esc(last.away.name)}</b><small>${esc(leagueFr(last.league))}</small></div><span class="sc num">${last.gh} – ${last.ga}</span></div></div>`;
  }
  h.innerHTML = html;
}

/* ---------------- onglets ---------------- */
const TABS = [["news", "Actus"], ["matches", "Matchs"], ["table", "Classement"], ["squad", "Effectif"]];
function renderTabs() { $("#tabs").innerHTML = TABS.map(([k, l]) => `<button class="tab" role="tab" data-tab="${k}" aria-selected="${tab === k}">${l}</button>`).join(""); }
function renderPanel() {
  const p = $("#panel");
  p.innerHTML = tab === "matches" ? viewMatches() : tab === "table" ? viewTable() : tab === "squad" ? viewSquad() : viewNews();
  if (tab === "news" && D.news && D.news.length) { lastSeenNews = Math.max(lastSeenNews, ...D.news.map(n => n.pub)); }
}
function viewNews() {
  const all = D.news || [];
  const err = D.errors && D.errors.news;
  if (!all.length) return `<p class="empty">${err ? esc(err) : "Chargement des actus…"}</p>`;
  const tags = ["Mercato", "Infirmerie", "Officiel", "Suspension"].filter(t => all.some(n => n.tag === t));
  const list = newsFilter === "all" ? all : all.filter(n => n.tag === newsFilter);
  return `<div class="chips"><button class="chip" data-nf="all" aria-pressed="${newsFilter === "all"}">Tout</button>${tags.map(t => `<button class="chip" data-nf="${t}" aria-pressed="${newsFilter === t}">${t}</button>`).join("")}</div>
    ${err ? `<p class="empty">${esc(err)} Dernières actus connues :</p>` : ""}
    <div class="news">${list.slice(0, 60).map(n => `<a class="item${n.pub > lastSeenNews && lastSeenNews ? " fresh-item" : ""}" href="${esc(n.link)}" target="_blank" rel="noopener">
      <div class="meta">${n.tag && n.tag !== "Compo" ? `<span class="tag ${esc(n.tag)}">${esc(n.tag)}</span>` : ""}<b>${esc(n.source || "Actu")}</b><span>${esc(ago(n.pub))}</span></div>
      <div class="title">${esc(n.title)}</div></a>`).join("")}</div>
    <p class="note">Titres issus de Google Actualités. L'article s'ouvre sur le site du média.</p>`;
}
function fxRow(f, isNext) {
  const o = DONE.has(f.status) ? outcome(f) : null;
  const opp = isUs(f.home) ? f.away : f.home;
  const where = isUs(f.home) ? "Domicile" : "Extérieur";
  const right = DONE.has(f.status) ? `${o ? `<span class="res ${o}">${OUT[o]}</span>` : ""}<span class="num">${f.gh}–${f.ga}</span>`
    : LIVE.has(f.status) ? `<span class="live" style="font-size:12px"><i></i>${f.gh}–${f.ga}</span>`
    : `<span class="num" style="font-size:18px;color:var(--muted)">${f.status === "TBD" ? "—" : esc(hour(f.ts))}</span>`;
  const note = ["PST", "CANC", "ABD"].includes(f.status) ? ` · ${STATUS[f.status]}` : "";
  return `<div class="fx${isNext ? " next" : ""}"><div class="d"><b>${esc(fmt(f.ts, { weekday: "short", day: "numeric" }))}</b>${esc(fmt(f.ts, { month: "short" }))}</div>
    <div class="vs2"><b>${isUs(f.home) ? "" : "@ "}${esc(opp ? opp.name : "")}</b><small>${esc(leagueFr(f.league))} · ${where}${esc(note)}</small></div><div class="r">${right}</div></div>`;
}
function viewMatches() {
  const list = fixtures(); if (!list.length) return `<p class="empty">${NATIVE && !P.hasKey ? "Ajoute ta clé API-Football dans les réglages pour voir le calendrier." : "Chargement du calendrier…"}</p>`;
  const nx = nextFx(list);
  const up = list.filter(f => !DONE.has(f.status) && f.ts * 1000 > Date.now() - 3 * 3600e3 || LIVE.has(f.status)).slice(0, 8);
  const done = list.filter(f => DONE.has(f.status)).slice(-10).reverse();
  const res = done.map(outcome).filter(Boolean);
  const w = res.filter(r => r === "w").length, d = res.filter(r => r === "d").length, l = res.filter(r => r === "l").length;
  return `<div class="h">À venir</div>${up.length ? up.map(f => fxRow(f, nx && f.id === nx.id)).join("") : `<p class="empty">Rien de programmé.</p>`}
    <div class="h">Résultats${res.length ? ` · ${w} V, ${d} N, ${l} D sur les ${res.length} derniers` : ""}</div>${done.length ? done.map(f => fxRow(f, false)).join("") : `<p class="empty">Pas encore de match joué.</p>`}`;
}
function zoneColor(desc) {
  if (/champions/i.test(desc)) return "#4f8bff"; if (/europa league/i.test(desc)) return "#e58a2e"; if (/conference/i.test(desc)) return "#2fc47b";
  if (/relegation/i.test(desc) && /play/i.test(desc)) return "#e5b53a"; if (/relegation/i.test(desc)) return "#ff4458"; return "";
}
function viewTable() {
  const rows = D.standings || [];
  if (!rows.length) return `<p class="empty">${NATIVE && !P.hasKey ? "Ajoute ta clé API-Football dans les réglages pour voir le classement." : "Chargement du classement…"}</p>`;
  const form = s => `<span class="form">${(s || "").slice(-5).split("").map(c => `<i class="${c}">${c === "W" ? "V" : c === "D" ? "N" : "D"}</i>`).join("")}</span>`;
  const zones = [...new Set(rows.map(r => r.desc).filter(Boolean))];
  const zoneFr = z => /champions/i.test(z) ? "Ligue des champions" : /europa league/i.test(z) ? "Ligue Europa" : /conference/i.test(z) ? "Ligue Conférence" : /relegation/i.test(z) && /play/i.test(z) ? "Barrage" : /relegation/i.test(z) ? "Relégation" : z;
  const scorers = D.scorers || [];
  return `<div class="h">Ligue 1</div><div class="tbl-wrap"><table><thead><tr><th>#</th><th>Équipe</th><th>J</th><th class="hide-sm">V</th><th class="hide-sm">N</th><th class="hide-sm">D</th><th>Diff</th><th>Pts</th><th class="hide-sm">Forme</th></tr></thead><tbody>
    ${rows.map(r => `<tr class="${r.id === TEAM() ? "us" : ""}"><td>${zoneColor(r.desc) ? `<span class="zone" style="background:${zoneColor(r.desc)}"></span>` : ""}${r.rank}</td><td>${esc(r.name)}</td><td>${r.played}</td><td class="hide-sm">${r.win}</td><td class="hide-sm">${r.draw}</td><td class="hide-sm">${r.lose}</td><td>${r.diff > 0 ? "+" : ""}${r.diff}</td><td class="pts">${r.pts}</td><td class="hide-sm">${form(r.form)}</td></tr>`).join("")}
    </tbody></table></div>
    ${zones.length ? `<div class="legend">${zones.map(z => zoneColor(z) ? `<span><i style="background:${zoneColor(z)}"></i>${esc(zoneFr(z))}</span>` : "").join("")}</div>` : ""}
    ${scorers.length ? `<div class="h">Meilleurs buteurs de Ligue 1</div><div class="tbl-wrap"><table><thead><tr><th>#</th><th>Joueur</th><th>Club</th><th>Buts</th><th class="hide-sm">Passes</th></tr></thead><tbody>
      ${scorers.map((s, i) => `<tr class="${s.teamId === TEAM() ? "us" : ""}"><td>${i + 1}</td><td>${esc(s.name)}</td><td style="text-align:right;color:var(--muted)">${esc(s.team)}</td><td class="pts">${s.goals}</td><td class="hide-sm">${s.assists}</td></tr>`).join("")}</tbody></table></div>` : ""}`;
}
function viewSquad() {
  const sq = D.squad || [];
  if (!sq.length) return `<p class="empty">${NATIVE && !P.hasKey ? "Ajoute ta clé API-Football dans les réglages pour voir l'effectif." : "Chargement de l'effectif…"}</p>`;
  const inj = new Map((D.injuries || []).filter(i => i.team === TEAM()).map(i => [i.id, i]));
  return Object.entries(POS).map(([k, label]) => {
    const g = sq.filter(p => p.pos === k).sort((a, b) => (a.number || 99) - (b.number || 99));
    if (!g.length) return "";
    return `<div class="h">${label} · ${g.length}</div><div class="squad">${g.map(p => { const i = inj.get(p.id); return `<div class="pl"><span class="n num">${p.number || ""}</span><div class="nm"><b>${esc(p.name)}</b><small>${p.age ? p.age + " ans" : ""}</small></div>${i ? `<span class="pill ${/questionable/i.test(i.type) ? "doubt" : "out"}" title="${esc(reasonFr(i.reason))}">${/questionable/i.test(i.type) ? "Incertain" : "Absent"}</span>` : ""}</div>`; }).join("")}</div>`;
  }).join("") + `<p class="note">« Absent » et « Incertain » concernent le prochain match.</p>`;
}

const closeSheet = () => { $("#sheetRoot").innerHTML = ""; };

/* ---------------- rendu & événements ---------------- */
function render() { renderFresh(); renderHero(); renderTabs(); renderPanel(); }
function reload() { load(); render(); if (refreshing && D.updatedAt && D.updatedAt !== refreshing) stopSpin(); }
function stopSpin() { refreshing = false; $("#refresh").classList.remove("spin"); }

document.addEventListener("click", e => {
  const t = e.target;
  const tb = t.closest("[data-tab]"); if (tb) { tab = tb.dataset.tab; try { localStorage.setItem("dogues.tab", tab); localStorage.setItem("dogues.seen", String(lastSeenNews)); } catch (x) {} renderTabs(); renderPanel(); $("#panel").scrollTop = 0; return; }
  const nf = t.closest("[data-nf]"); if (nf) { newsFilter = nf.dataset.nf; renderPanel(); return; }
  const pr = t.closest("[data-pref]");
  if (pr) { const v = pr.getAttribute("aria-checked") !== "true"; pr.setAttribute("aria-checked", String(v)); P[pr.dataset.pref] = v; if (NATIVE) NATIVE.setPref(pr.dataset.pref, v); return; }
  if (t.closest("#settingsBtn")) { openSettings(); return; }
  if (t.closest("#refresh")) {
    if (!NATIVE) { toast("Aperçu : rien à actualiser."); return; }
    refreshing = D.updatedAt || 1; $("#refresh").classList.add("spin"); NATIVE.refresh();
    setTimeout(() => { if (refreshing) { stopSpin(); toast("Pas de réponse pour l'instant. Vérifie ta connexion."); } }, 25000);
    return;
  }
  const a = t.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  if (act === "scrim" && t !== a) return;
  if (act === "scrim" || act === "close") closeSheet();
  else if (act === "settings") openSettings();
  else if (act === "notif-settings") { if (NATIVE) NATIVE.openNotifSettings(); }
  else if (act === "save-key") {
    const k = $("#key").value.trim();
    if (!/^[A-Za-z0-9]{20,64}$/.test(k)) { toast("Ça ne ressemble pas à une clé API-Football (lettres et chiffres)."); return; }
    if (NATIVE) { NATIVE.setKey(k); refreshing = D.updatedAt || 1; $("#refresh").classList.add("spin"); }
    closeSheet(); toast("Clé enregistrée. Chargement des matchs…");
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

// Bouton retour d'Android : ferme la fenêtre ouverte, sinon quitte l'appli
window.liseuseBack = () => { if ($("#sheetRoot").innerHTML) { closeSheet(); return true; } return false; };
window.liseuseUpdateReady = () => toast("Nouvelle version de l'interface téléchargée. Elle s'applique au prochain lancement.", 4000);
window.dogues = { onData: reload };

setInterval(() => {
  const c = document.getElementById("count");
  if (c) { const ts = +c.dataset.ts; if (ts * 1000 <= Date.now()) renderHero(); else c.outerHTML = countdown(ts); }
}, 1000);
setInterval(() => { if (NATIVE) reload(); else renderFresh(); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) reload(); });

load(); render();
call("ready");
